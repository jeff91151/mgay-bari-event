<style>

const BONE="#F2EEE3", INK="#1A1512", RED="#96271F";

/* ============================================================
   花紋種子 — 每個訪客織出來的布都不一樣
   資料記載：每位織者的菱形都不同，有的銳有的圓，沒有兩塊一樣
   ============================================================ */
const SEED = {
  period : 26 + Math.floor(Math.random()*18),   // 菱形寬度
  edge   : 0.74 + Math.random()*0.14,           // 外框起點
  core   : 0.30 + Math.random()*0.14,           // 內菱形大小
  pupil  : Math.random() < 0.65,                // 有沒有中心點
  stripe : Math.random() < 0.5                  // 有沒有邊線
};

/* 回傳某一格的顏色。
   x = 第幾條緯線，y = 布幅上的位置，vp = 垂直週期（織帶一排、成品堆疊好幾排） */
function threadColour(x, y, H, acc, vp){
  vp = vp || H;
  const u = ((x % SEED.period) / SEED.period) * 2 - 1;
  const v = ((y % vp) / vp) * 2 - 1;
  const d = Math.abs(u) + Math.abs(v);
  const e = y % vp;
  if (SEED.stripe && (e < vp*0.045 || e > vp*0.955)) return INK;  // 布邊／排與排之間
  if (d > 1)            return BONE;
  if (d > SEED.edge)    return INK;
  if (d > SEED.core)    return BONE;
  if (SEED.pupil && d < SEED.core*0.4) return BONE;               // 祖靈之眼的瞳
  return acc;
}

function weaveColumn(ctx, x, H, acc, scale, vp){
  for (let y = 0; y < H; y++){
    ctx.fillStyle = threadColour(x, y, H, acc, vp);
    ctx.fillRect(x*scale, y*scale, scale, scale);
  }
}

  return `<svg class="eye" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">

    <path d="M50 19 L81 50 L50 81 L19 50 Z" fill="none" stroke="#1A1512" stroke-width="3"/>
    <path d="M50 33 L67 50 L50 67 L33 50 Z" fill="#96271F"/>
    <path d="M50 43 L57 50 L50 57 L43 50 Z" fill="#F2EEE3"/>
  </svg>`;
}

function render(){
  $("#main").innerHTML = TOPICS.map((t,i)=>`
    <section class="topic" id="t-${t.k}" style="--acc:${t.acc}">
      <div class="wrap">${dividerSVG()}</div>
      <div class="wrap">
        <p class="eyebrow rise">${String(i+1).padStart(2,"0")} &nbsp;/&nbsp; <b>${esc(t.term)}</b></p>
        <h2 class="term truku rise">${esc(t.term)}</h2>
        <p class="en rise">${esc(t.en)}</p>
        <p class="hook rise">${esc(t.hook)}</p>
        <figure class="rise">
          <img src="${esc(t.img)}" alt="${esc(t.en)}" loading="lazy" decoding="async">
          <figcaption>${t.credit}</figcaption>
        </figure>
        ${t.body.map(p=>`<p class="body rise">${p}</p>`).join("")}
        <div class="keys rise">${t.keys.map(([a,b])=>
          `<span class="key"><b class="truku">${esc(a)}</b> ${esc(b)}</span>`).join("")}</div>
      </div>
    </section>`).join("")
  + `
    <section class="topic" id="finale" style="--acc:#96271F">
      <div class="wrap">${dividerSVG()}</div>
      <div class="wrap finale">
        <h2 class="rise">Your cloth</h2>
        <p class="sub rise">Woven, row by row, while you read.</p>
        <img id="cloth" class="rise" alt="The cloth you wove while reading">
        <p class="note rise">No two hand-woven Truku cloths carry the same diamonds —
           some sharp, some rounded, each one the hand of its weaver. This one was woven
           for your visit only; reload the page and you will get a different one.</p>
        <p class="savehint rise">
          <span class="touch">Press and hold the cloth to save it.</span>
          <span class="mouse">Right-click the cloth to save it.</span>
        </p>
        <button class="save rise" id="save" type="button" hidden>Share your cloth</button>
      </div>
    </section>

    <section class="topic" id="quizsec" style="--acc:#96271F">
      <div class="wrap">${dividerSVG()}</div>
      <div class="wrap quizwrap">
        <h2 class="rise">Six questions</h2>
        <p class="sub rise">Every answer is somewhere above.</p>
        <div class="rise" id="qbox"></div>
        <div class="qdots" id="qdots"></div>
      </div>
    </section>

      <div class="wrap"><div class="phrase" id="phrase"></div></div>
    </section>

    <div class="wrap closing">
      ${eyeSVG(74)}
      <p>Mgay Bari is held each autumn by the Truku community.
         If you are in Taiwan then, you are welcome at it.</p>
    </div>

    <footer>
      © Truku Traditional Archery &amp; Arts Association, New Taipei City<br>

/* ============================================================
   底部織布機 — 捲動帶動梭子
   ============================================================ */
const loom = { cv:null, ctx:null, cols:0, H:0, scale:1, woven:0, bands:[] };

function setupLoom(){
  const cv = $("#loom"), dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth, h = cv.clientHeight || 38;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  loom.cv = cv; loom.ctx = cv.getContext("2d");
  loom.scale = dpr;
  loom.H = Math.round(h);
  loom.cols = Math.round(w);
  loom.ctx.fillStyle = BONE;
  loom.ctx.fillRect(0,0,cv.width,cv.height);
  loom.woven = 0;
  measureBands();
  tick(true);
}

/* 每一段在整頁捲動中的位置，決定那一段織出來是什麼顏色 */
function measureBands(){
  const total = document.documentElement.scrollHeight - window.innerHeight;
  loom.bands = TOPICS.map(t=>{
    const el = document.getElementById("t-"+t.k);
    return { top: el ? el.offsetTop/Math.max(total,1) : 1, acc: t.acc };
  });
}
function accAt(p){
  let acc = RED;
  for (const b of loom.bands) if (p >= b.top - 0.02) acc = b.acc;
  return acc;
}

function tick(force){
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const p = Math.min(1, Math.max(0, window.scrollY / Math.max(total,1)));
  const target = Math.round(p * loom.cols);
  if (!force && target <= loom.woven) return;      // 布不會被拆回去
  for (let x = loom.woven; x < target; x++){
    weaveColumn(loom.ctx, x, loom.H, accAt(x/loom.cols), loom.scale);
  }
  if (target > loom.woven){
    loom.woven = target;
    const lbl = $("#loomlabel");
    if (loom.woven > loom.cols*0.08) lbl.classList.add("show");
  }
}

/* ============================================================
   成品 — 放大版，可以存下來
   ============================================================ */
let clothBlob = null;

function drawCloth(){
  const img = $("#cloth");
  if (!img) return;
  const w = Math.min(img.parentElement.clientWidth, 640), h = 150;
  const dpr = 2;                                   // 存下來的圖固定 2 倍解析度
  const cv = document.createElement("canvas");     // 離屏繪製，最後輸出成圖片
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext("2d");
  ctx.fillStyle = BONE; ctx.fillRect(0,0,cv.width,cv.height);
  // 把六段顏色平均分佈成條紋，和底部那條同一套花紋
  const vp = SEED.period;              // 讓菱形接近正方，堆成好幾排
  for (let x = 0; x < w; x++){
    const seg = Math.min(TOPICS.length-1, Math.floor(x / w * TOPICS.length));
    weaveColumn(ctx, x, h, TOPICS[seg].acc, dpr, vp);
  }
  // 用 <img> 呈現：手機長按才會出現「儲存影像」，canvas 不會
  try{ img.src = cv.toDataURL("image/png"); }catch(e){}
  if (cv.toBlob) cv.toBlob(b => { clothBlob = b; }, "image/png");
}

/* 長按／右鍵存圖是主要方式，到處都能用。
   只有在系統真的支援檔案分享時，才額外多給一顆分享按鈕，
   不會留一顆按了沒反應的死按鈕。 */
function setupSave(){
  const btn = $("#save");
  if (!btn || !navigator.canShare) return;
  try{
    const probe = new File([new Blob()], "t.png", {type:"image/png"});
    if (!navigator.canShare({files:[probe]})) return;
  }catch(e){ return; }
  btn.hidden = false;
  btn.addEventListener("click", async ()=>{
    if (!clothBlob) return;
    try{
      const file = new File([clothBlob], "truku-cloth.png", {type:"image/png"});
      await navigator.share({files:[file], title:"My Truku cloth"});
    }catch(e){ /* 使用者取消或系統不給，長按那條路還在 */ }
  });
}

/* 開場的示範織帶 */
function heroLoom(){
  const cv = $("#heroloom"), dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = cv.clientWidth, h = 34;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const ctx = cv.getContext("2d");
  ctx.fillStyle = BONE; ctx.fillRect(0,0,cv.width,cv.height);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){
    for (let x=0;x<w;x++) weaveColumn(ctx,x,h,RED,dpr);
    return;
  }
  let x = 0;
  (function step(){
    for (let n=0; n<4 && x<w; n++, x++) weaveColumn(ctx,x,h,RED,dpr);
    if (x < w) requestAnimationFrame(step);
  })();
}

/* ============================================================
   測驗
   ============================================================ */
let qi = 0, hits = 0;
function renderQ(){
  if (qi >= TOPICS.length){
    $("#qbox").innerHTML = `<div class="qcard qscore">
        ${eyeSVG(64)}
        <p style="margin:0;color:var(--muted);font-size:15px">You got</p>
        <p class="big">${hits} / ${TOPICS.length}</p>
        <p style="margin:10px 0 0;color:var(--muted);font-size:15px">
          ${hits===TOPICS.length ? "Mhuway su balay — thank you for reading."
            : "Everything is still above, if you want another look."}</p>
      </div>`;
    return;
  }
  const t = TOPICS[qi];
  $("#qbox").innerHTML = `<div class="qcard" style="--acc:${t.acc}">
      <p class="qnum">Question ${qi+1} of ${TOPICS.length} &nbsp;·&nbsp; ${esc(t.term)}</p>
      <p class="qtext">${t.q}</p>
      ${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">
         <span class="mk">${"ABC"[i]}</span><span>${esc(o)}</span></button>`).join("")}
      <p class="qfeed" id="qfeed"></p>
    </div>`;
  $("#qbox").querySelectorAll(".opt").forEach(b => b.addEventListener("click", ()=>pick(b,t)));
  paintDots();
}
function pick(btn, t){
  const box = $("#qbox");
  if (box.dataset.locked) return;
  box.dataset.locked = "1";
  const chosen = Number(btn.dataset.i), right = chosen === t.a;
  box.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled = true;
    if (i === t.a) b.classList.add("ok");
    else if (i === chosen) b.classList.add("no");
  });
  if (right) hits++;
  t.got = right;
  $("#qfeed").textContent = right ? "Yes." : "The one marked above is the one.";
  paintDots();
  setTimeout(()=>{ qi++; box.dataset.locked=""; renderQ(); }, right ? 900 : 1700);
}
function paintDots(){
  $("#qdots").innerHTML = TOPICS.map((t,i)=>
    `<span class="qdot ${i<qi ? (t.got?"hit":"miss") : ""}"></span>`).join("");
}

/* ============================================================
   族語
   ============================================================ */
let pIdx = 0;
function renderPhrase(i){
  pIdx = i;
  const [tw,en] = PHRASES[i];
  $("#phrase").innerHTML = `
    <p class="cap">Say something in Truku</p>
    <p class="tw truku" id="ph-tw">${esc(tw)}</p>
    <p class="gl" id="ph-en">${esc(en)}</p>
    <div class="ph-controls">
      <button class="ph-play" id="ph-play">▶　Hear it spoken</button>
      <button class="ph-next" id="ph-next">Another one</button>
    </div>
    <p class="ph-tip">Recorded by a Truku language teacher.
       If you hear nothing, check your volume and the silent switch on your phone.</p>
    <audio id="ph-audio" preload="auto" playsinline src="audio/${i+1}.m4a"></audio>`;
  const play = $("#ph-play"), audio = $("#ph-audio");
  const setL = t => { if (play) play.textContent = t; };
  $("#ph-next").addEventListener("click", ()=>{
    let n; do { n = Math.floor(Math.random()*PHRASES.length); } while (n === pIdx);
    renderPhrase(n);
  });
  // 手機瀏覽器一律禁止自動播放，一定要使用者自己點
  play.addEventListener("click", async ()=>{
    if (!audio.paused){ audio.pause(); audio.currentTime = 0; setL("▶　Hear it spoken"); return; }
    try { setL("Playing…"); await audio.play(); }
    catch(e){ setL("Could not play — check volume"); }
  });
  audio.addEventListener("ended", ()=> setL("▶　Hear it again"));
  audio.addEventListener("error", ()=> setL("Audio unavailable"));
}

/* ============================================================
   啟動
   ============================================================ */
render();
renderQ();
renderPhrase(Math.floor(Math.random()*PHRASES.length));
heroLoom();
setupLoom();
drawCloth();
setupSave();

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if (!e.isIntersecting) return;
    e.target.classList.add("seen");
    io.unobserve(e.target);
  });
}, { rootMargin:"0px 0px -18% 0px", threshold:0.12 });
document.querySelectorAll(".topic").forEach(s => io.observe(s));

let raf = 0;
addEventListener("scroll", ()=>{ if(!raf) raf = requestAnimationFrame(()=>{ raf=0; tick(false); }); }, {passive:true});
addEventListener("load", ()=>{ measureBands(); drawCloth(); tick(true); });
let rz;
addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ setupLoom(); drawCloth(); }, 200); });
</script>
