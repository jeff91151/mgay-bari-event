<style>
:root{
  --bone:#F2EEE3; --paper:#FFFFFF; --ink:#1A1512;
  --red:#96271F; --red-deep:#741D17; --forest:#2E5A38;
  --muted:#6E6559; --line:#DCD4C3; --warm:#FAF3E2;
  --acc:#96271F;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bone);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.75;}
.truku{font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;}

/* 菱形紋 */
.p-bg{fill:var(--bone);} .p-ink{fill:var(--ink);} .p-eye{fill:var(--bone);}
.p-out{fill:none;stroke:var(--red);stroke-width:2.2;}
.p-tri{fill:var(--red);}
.p-rule{fill:none;stroke:var(--red);stroke-width:1.3;}
.band{display:block;width:100%;height:34px;}
.rule{display:block;width:100%;height:14px;margin:34px 0 26px;}

.wrap{max-width:640px;margin:0 auto;padding:0 20px;}
.masthead{padding:28px 16px 16px;}
.masthead img{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;}
.langbar{text-align:center;padding:0 16px 18px;}
.langbar a{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);}
.langbar a:hover{color:var(--ink);border-color:var(--ink);}

.progress{display:flex;align-items:center;gap:14px;padding:26px 0 18px;}
.pips{display:flex;gap:9px;}
.pip{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--line);}
.pip.done{background:var(--red);border-color:var(--red);}
.pip.now{background:var(--acc);border-color:var(--acc);}
.progress .label{font-size:13px;color:var(--muted);letter-spacing:.03em;}

.term{font-size:clamp(38px,12.5vw,58px);line-height:1.04;margin:0;font-weight:700;color:var(--acc);}
.term-zh{display:inline-block;background:var(--acc);color:var(--bone);
  font-size:17px;font-weight:700;padding:6px 14px;margin:14px 0 0;letter-spacing:.01em;}
.story-title{font-size:16px;color:var(--muted);margin:8px 0 0;}
header.is-menu .term{display:none;}
header.is-menu .term-zh{background:none;color:var(--ink);font-size:30px;padding:0;margin:0;}

.keys{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;}
.key{border:1px solid var(--line);background:var(--paper);padding:6px 11px;font-size:14px;line-height:1.5;}
.key b{color:var(--red);font-weight:700;font-size:15px;}

.lede{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:20px 0;margin:22px 0 28px;}
.lede p{margin:0 0 14px;font-size:16px;}
.lede p:last-child{margin-bottom:0;}
.lede b{color:var(--red-deep);}

.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border:2px solid var(--ink);display:block;margin-bottom:8px;}
.credit{font-size:12px;color:var(--muted);margin:0 0 22px;line-height:1.6;}
.intro p{margin:0 0 18px;}
.intro p:last-child{margin-bottom:0;}

.quiz{background:var(--paper);border:2px solid var(--ink);padding:24px 20px;}
.quiz h2{font-size:14px;margin:0 0 6px;color:var(--acc);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.question{font-size:18px;font-weight:600;line-height:1.6;margin:0 0 20px;}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;min-height:58px;
  padding:15px 16px;margin-bottom:10px;background:var(--bone);color:var(--ink);
  border:1.5px solid var(--line);font:inherit;font-size:16px;line-height:1.5;
  text-align:left;cursor:pointer;}
.opt:last-of-type{margin-bottom:0;}
.opt .mk{font-weight:700;color:var(--acc);flex:none;}
.opt:hover:not(:disabled){border-color:var(--ink);}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}
.opt.wrong{background:#E9E2D6;border-color:var(--muted);color:var(--muted);}
.opt.wrong .mk{color:var(--muted);}
.feedback{margin:15px 0 0;font-size:15px;color:var(--muted);}

.correct{background:var(--warm);border:2px solid var(--acc);padding:24px 20px;text-align:center;}
.correct .eye{margin:0 auto 10px;display:block;}
.correct h2{margin:0 0 6px;font-size:21px;color:var(--forest);}
.correct p{margin:0;color:var(--muted);font-size:15px;}

.btn{width:100%;min-height:56px;border:none;background:var(--acc);color:#fff;
  font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:22px;}
.btn:hover{filter:brightness(.85);}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.btn-ghost{width:100%;min-height:52px;background:transparent;border:1.5px solid var(--ink);
  color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;}
.btn-ghost:hover{background:var(--ink);color:var(--bone);}

/* 族語片語 */
.phrase{background:var(--ink);color:var(--bone);padding:24px 20px;margin-top:14px;text-align:left;}
.phrase .cap{font-size:12px;color:#B9AE9B;margin:0 0 12px;letter-spacing:.08em;text-transform:uppercase;}
.phrase .tw{font-size:26px;line-height:1.3;margin:0;font-weight:700;color:#fff;}
.phrase .zh{font-size:17px;margin:8px 0 0;color:#D8CEBC;}
.ph-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.ph-play{flex:2 1 180px;min-height:54px;background:var(--bone);color:var(--ink);
  border:none;font:inherit;font-size:16px;font-weight:700;cursor:pointer;}
.ph-play:hover{background:#fff;}
.ph-next{flex:1 1 130px;min-height:54px;background:transparent;border:1.5px solid #6F6558;
  color:var(--bone);font:inherit;font-size:15px;cursor:pointer;}
.ph-next:hover{border-color:var(--bone);}
.ph-play:focus-visible,.ph-next:focus-visible{outline:3px solid var(--bone);outline-offset:2px;}
.ph-tip{font-size:13px;color:#9E9484;margin:12px 0 0;line-height:1.55;}

/* 總覽 */
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:18px 0;
  border:none;border-bottom:1px solid var(--line);background:transparent;
  font:inherit;text-align:left;cursor:pointer;color:var(--ink);}
.menu-item:first-of-type{border-top:1px solid var(--line);}
.menu-item .mk-dot{width:13px;height:13px;transform:rotate(45deg);flex:none;}
.menu-item .n{flex:1;}
.menu-item .t{display:block;font-size:24px;font-weight:700;line-height:1.2;}
.menu-item .z{display:block;font-size:14px;color:var(--muted);}
.menu-item .st{flex:none;font-size:12px;color:var(--muted);letter-spacing:.04em;}
.menu-item .st.ok{color:var(--forest);font-weight:700;}

footer{margin-top:40px;padding:18px 0 48px;font-size:12px;color:var(--muted);
  text-align:center;line-height:1.8;}
.hidden{display:none !important;}
@keyframes bloom{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
.correct .eye{animation:bloom .45s ease-out;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>

<script>
/* ============================================================
   六個主題
   ============================================================ */
const ORDER = ["tower","house","archery","trap","weaving","mgaybari"];

const TOPICS = {
  tower:{
    term:"Daka", en:"The Watchtower", zh:"瞭望台", accent:"#23386E",
    storyTitle:"The eyes of the village, and its first line of defence",
    keys:[["Daka","watchtower; to stand high and look out"],["Truku","a terrace on the mountainside, a place fit to live"],["Sapah","house, home"]],
    image:"img/tower.jpg",
    credit:"Photo: Mgay Bari 2026 event site. Courtesy of the Association.",
    intro:[
      "Truku villages were built to be defended. At the entrance, or on the highest ground, stood a tall watchtower — a <b>Daka</b>. The word itself means to stand high and look out.",
      "The tower was never only a structure. It guarded the <b>Sapah</b>, the house and everything in it. Young men took turns keeping watch through the night alongside their elders, learning to read a shift in the wind or a movement in the grass. It was part of becoming a warrior, and an expression of a community that defended itself together.",
      "The people's own name carries a related meaning. <b>Truku</b> is a terrace on the mountainside, a place fit to live — and precisely the kind of ground you want when you are watching for an approach. Keeping watch is written into the name of the people."
    ],
    question:"In the Truku language, what does <i>Daka</i> mean — and what was the watchtower built for?",
    options:["Observing the stars and predicting the weather",
             "Standing high to look out and keep the village safe",
             "Storing the community's harvest"],
    answer:1,
    hint:"The answer is in the first paragraph, in the meaning of the word itself."
  },

  house:{
    term:"Sapah", en:"The Traditional House", zh:"傳統家屋", accent:"#94611E",
    storyTitle:"Breathing with the land: the semi-subterranean house",
    keys:[["Sapah","house, home"],["Gaya","ancestral law and discipline"]],
    image:"img/house.jpg",
    credit:"Photo: Indigenous Peoples Cultural Development Center, via Taiwan Cultural Memory Bank (CC BY-NC).",
    intro:[
      "A traditional Truku house is dug partly into the ground. That semi-subterranean form keeps the interior cool through summer and warm through winter, and lets the building sit low under the strong mountain winds — environmental knowledge built into the architecture itself.",
      "At the centre of every <b>Sapah</b> is a hearth that is never allowed to go out. Food is cooked there and the family gathers around it, but its deeper role is as the place where elders hand down history and <b>Gaya</b> — the body of law and discipline inherited from the ancestors. A fire that keeps burning stands for a family line that keeps going."
    ],
    question:"Inside a traditional Truku house, which place is the sacred centre where history and <i>Gaya</i> are passed down?",
    options:["The stone steps at the entrance",
             "The hearth that is never allowed to go out",
             "The roof space where game is stored"],
    answer:1,
    hint:"Look for the thing at the very centre of the house that burns all year round."
  },

  archery:{
    term:"Smbu buji", en:"Archery and Hunting", zh:"射箭體驗", accent:"#3860D9",
    storyTitle:"A warrior's test: living alongside the animals of the forest",
    keys:[["Smbu buji","to shoot a bow"],["Tmsamat","hunting"],["Utux","ancestral spirits"],["Gaya","prohibitions and law"]],
    image:"img/archery.jpg",
    credit:"Photo: Truku Traditional Archery & Arts Association, New Taipei City.",
    intro:[
      "The Truku word for hunting is <b>Tmsamat</b>. It does not mean killing animals, as a modern reader might assume. It means living attentively in the forest, alongside the animals.",
      "Before entering the mountains a hunter must keep <b>Gaya</b> strictly — the prohibitions and the law. Hunters hold the forest in awe and believe that everything taken is a gift from the <b>Utux</b>, the ancestral spirits. The highest principle of Tmsamat is to take only what is needed, and never to hunt a place empty. It is a working definition of sustainability, arrived at long before the word existed."
    ],
    question:"What does the Truku word for hunting, <i>Tmsamat</i>, actually mean?",
    options:["Catching as much game as possible, to prove your strength",
             "Living attentively in the forest alongside the animals, taking only what is needed",
             "Driving every animal out of the forest"],
    answer:1,
    hint:"Read the first paragraph again — it gives the original sense of the word."
  },

  trap:{
    term:"Powsa qlubung", en:"Setting Snares", zh:"狩獵陷阱", accent:"#237A41",
    storyTitle:"Borrowing from nature: quiet knowledge, and sharing",
    keys:[["Powsa qlubung","to set a snare"],["Qlubung","snare, trap"]],
    image:"img/trap.jpg",
    credit:"Photo: Association archive.",
    intro:[
      "In dense forest, Truku hunters build a range of traps. They read an animal's habits and the paths it walks, then use whatever is at hand — branches, the spring of a bent sapling, the weight of a stone slab — to set the <b>Qlubung</b>.",
      "It is precise work, and different animals call for entirely different mechanisms. What matters just as much is what happens afterwards: a catch is carried back to the village and shared. That sharing, given without expectation of return, is one of the foundations of Truku social life."
    ],
    question:"After a successful catch from a snare, what would a Truku hunter always do?",
    options:["Carry it back and share it with the whole community",
             "Hide it in the forest as a private store of food",
             "Trade it to a neighbouring village for weapons"],
    answer:0,
    hint:"The second paragraph ends on it — what is done with the catch."
  },

  weaving:{
    term:"Tminun", en:"Weaving", zh:"傳統織布", accent:"#DA0030",
    storyTitle:"Eye of the ancestors: the pattern that watches over you",
    keys:[["Tminun","weaving"],["Ubung","ground loom"],["Ptasan","facial tattoo"],["Hakaw Utux","the Rainbow Bridge"],["Dowriq Utux","Eye of the Ancestors"]],
    image:"img/weaving.jpg",
    credit:"Photo: Hualien County Cultural Affairs Bureau, via Taiwan Cultural Memory Bank (CC0).",
    intro:[
      "Weaving sits at the centre of a Truku woman's life. Working the traditional ground loom, the <b>Ubung</b>, takes years of patience to learn. In the past, only a woman who had mastered <b>Tminun</b> could receive the facial tattoo, <b>Ptasan</b> — and that tattoo was her only proof of passage across the Rainbow Bridge, <b>Hakaw Utux</b>, returning her to the ancestors after death.",
      "The diamond is the most characteristic motif in Truku textiles. It is the <b>Dowriq Utux</b>, the Eye of the Ancestors: a sign that the ancestors are watching over their descendants from above, and a reminder to the living to keep Gaya. You have been looking at it since you opened this page — it runs along the top and bottom of every screen here."
    ],
    question:"In traditional Truku society, what honour did a woman who mastered weaving receive, which served as her proof for crossing the Rainbow Bridge?",
    options:["A hunting knife of her own",
             "The right to receive the facial tattoo (Ptasan)",
             "Leadership of the village"],
    answer:1,
    hint:"The first paragraph names the one thing that counted as proof."
  },

  mgaybari:{
    term:"Mgay Bari", en:"The Thanksgiving Ceremony", zh:"太魯閣歲時祭儀", accent:"#96271F",
    storyTitle:"Offering the deepest thanks to the ancestors",
    keys:[["Mgay Bari","the thanksgiving ceremony"],["Utux rudan","the spirits of the ancestors"],["Gaya","ancestral law"]],
    image:"img/mgaybari.jpg",
    credit:"Photo: New Taipei City Joint Indigenous Cultural Festival, 2025. Courtesy of the Association.",
    intro:[
      "<b>Mgay Bari</b> is the most important gathering of the Truku year, and the occasion this whole project was built around.",
      "Once the harvest is in, the community holds a ceremony offering the finest crops and game to the <b>Utux rudan</b>, the spirits of the ancestors, in thanks for a year of protection and provision. It is more than a harvest festival. It is when a community scattered through the year comes back together, and when Gaya and the culture are handed to the next generation. In the great circle dance everyone holds hands — the clearest statement a people can make about being one."
    ],
    question:"At the heart of Mgay Bari, who is being thanked for a year of harvest and protection?",
    options:["A sun god",
             "The ancestral spirits (Utux / Utux rudan)",
             "The chief of a neighbouring village"],
    answer:1,
    pin:2,
    hint:"The second paragraph says who the crops and game are offered to."
  }
};

/* ============================================================
   Truku phrases — recorded by a Truku language teacher
   ============================================================ */
const AUDIO_DIR = "audio", AUDIO_EXT = ".m4a";
const PHRASES = [
  ["Embiyax su hug?","How are you?"],
  ["Embiyax ku.","I'm well."],
  ["Mhuway su balay.","Thank you."],
  ["Ini huya!","It's all right."],
  ["Ini ta bi kla.","I'm sorry."],
  ["Iya qsiqa!","Don't be shy!"],
  ["Swayay ta han!","Goodbye!"],
  ["Laqi ku Truku ka yaku.","I am a Truku child."],
  ["Mkla ku rmngaw kari Truku.","I can speak Truku."],
  ["Piya tuki ka sayang da?","What time is it?"],
  ["Gaga inu ka saan ngangut hug?","Where is the toilet?"],
  ["Mha su inu?","Where are you going?"],
  ["Ima ka hangan su?","What is your name?"],
  ["Mkla ku rmgrig.","I can dance."],
  ["Mkla ku meuyas.","I can sing."],
  ["Mkla ku tminun.","I can weave."]
];

/* ============================================================
   State
   ============================================================ */
const K_READ = "mb_en_read_v1";
const state = { topic:null, phraseIdx:0 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function loadRead(){ try{ return JSON.parse(localStorage.getItem(K_READ)||"[]"); }catch(e){ return []; } }
function markRead(k){ try{ const a=loadRead(); if(!a.includes(k)){ a.push(k); localStorage.setItem(K_READ,JSON.stringify(a)); } }catch(e){} }

/* ============================================================
   Render
   ============================================================ */
function render(){ state.topic ? renderTopic() : renderHome(); window.scrollTo(0,0); }

function renderProgress(activeKey){
  const read = loadRead();
  const pips = ORDER.map(k =>
    `<span class="${k===activeKey ? "pip now" : (read.includes(k) ? "pip done" : "pip")}"></span>`).join("");
  const label = activeKey
    ? `Topic ${ORDER.indexOf(activeKey)+1} of ${ORDER.length}`
    : `${read.length} of ${ORDER.length} read`;
  $("progress").innerHTML = `<div class="pips">${pips}</div><span class="label">${label}</span>`;
}

function renderHome(){
  renderProgress(null);
  document.documentElement.style.setProperty("--acc", "#96271F");
  $("header").className = "is-menu";
  $("term").textContent = "";
  $("term-zh").textContent = "Truku Culture";
  $("story-title").textContent = "Six topics from an Indigenous people of eastern Taiwan";
  $("keys").innerHTML = "";
  document.title = "Mgay Bari — Truku Culture";

  $("main").innerHTML = `
    <div class="lede">
      <p>The <b>Truku</b> (太魯閣族) are one of Taiwan's officially recognised Indigenous
         peoples, living mainly in the mountains and river valleys of Hualien County, on the
         island's east coast. They were recognised as a distinct people in January 2004;
         before that they were classified together with the Atayal.</p>
      <p>Two ideas run underneath everything on this page. <b>Utux</b> are the ancestral
         spirits. <b>Gaya</b> is the inherited body of law that governs how a person hunts,
         weaves, builds a house and treats other people. Almost every practice here traces
         back to one or both.</p>
      <p><b>Mgay Bari</b> is the Truku thanksgiving ceremony, and the most important
         gathering of their year.</p>
    </div>
    ${ORDER.map(k=>{
      const t = TOPICS[k], ok = loadRead().includes(k);
      return `<button class="menu-item" data-k="${k}">
        <span class="mk-dot" style="background:${t.accent}"></span>
        <span class="n">
          <span class="t truku" style="color:${t.accent}">${esc(t.term)}</span>
          <span class="z">${esc(t.en)}</span>
        </span>
        <span class="st ${ok?"ok":""}">${ok?"READ":""}</span>
      </button>`;
    }).join("")}
    <svg class="rule" aria-hidden="true" focusable="false"><rect width="100%" height="14" fill="url(#pat-rule)"/></svg>
    ${phraseHTML("Learn a phrase in Truku")}
  `;
  $("main").querySelectorAll(".menu-item").forEach(b =>
    b.addEventListener("click", ()=>{ state.topic = b.dataset.k; render(); }));
  bindPhrase();
}

function renderTopic(){
  const key = state.topic, t = TOPICS[key];
  renderProgress(key);
  document.documentElement.style.setProperty("--acc", t.accent);
  $("header").className = "";
  $("term").textContent = t.term;
  $("term-zh").textContent = t.en;
  $("story-title").textContent = t.storyTitle;
  $("keys").innerHTML = t.keys.map(([a,b]) =>
    `<span class="key"><b class="truku">${esc(a)}</b> ${esc(b)}</span>`).join("");
  document.title = t.term + " — Truku Culture";

  const i = ORDER.indexOf(key);
  const nextKey = ORDER[i+1] || null;

  $("main").innerHTML = `
    <img class="photo" src="${esc(t.image)}" alt="${esc(t.en)}">
    <p class="credit">${esc(t.credit)}</p>
    <div class="intro">${t.intro.map(p=>`<p>${p}</p>`).join("")}</div>

    <svg class="rule" aria-hidden="true" focusable="false"><rect width="100%" height="14" fill="url(#pat-rule)"/></svg>

    <section class="quiz" id="quiz">
      <h2>Check your understanding</h2>
      <p class="question">${t.question}</p>
      ${t.options.map((o,n)=>`<button class="opt" data-i="${n}">
          <span class="mk">${"ABC"[n]}</span><span>${esc(o)}</span></button>`).join("")}
      <p class="feedback" id="feedback"></p>
    </section>

    <section class="correct hidden" id="correct">
      ${eyeSVG(92)}
      <h2>That's right</h2>
      <p>${nextKey ? "Carry on to the next topic below." : "That was the last of the six topics."}</p>
    </section>

    ${nextKey
      ? `<button class="btn" id="next">Next: ${esc(TOPICS[nextKey].term)} — ${esc(TOPICS[nextKey].en)}</button>`
      : `<section class="hidden" id="endphrase"></section>`}
    <button class="btn-ghost" id="toHome">All six topics</button>
  `;

  $("quiz").querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", ()=>answer(b, t, nextKey)));
  $("toHome").addEventListener("click", ()=>{ state.topic = null; render(); });
  const nx = $("next");
  if (nx) nx.addEventListener("click", ()=>{ state.topic = nextKey; render(); });
}

function answer(btn, t, nextKey){
  if (Number(btn.dataset.i) === t.answer){
    markRead(state.topic);
    $("quiz").classList.add("hidden");
    $("correct").classList.remove("hidden");
    renderProgress(state.topic);
    if (!nextKey){                       // 最後一個主題：用族語道別收尾
      const box = $("endphrase");
      box.className = "";
      box.innerHTML = phraseHTML("One last phrase", t.pin);
      bindPhrase();
    }
    $("correct").scrollIntoView({behavior:"smooth", block:"center"});
  } else {
    btn.disabled = true;
    btn.classList.add("wrong");
    $("feedback").textContent = "Not that one. " + t.hint;
  }
}

/* ---------- phrases ---------- */
function phraseHTML(caption, pin){
  const i = (typeof pin === "number") ? pin : Math.floor(Math.random()*PHRASES.length);
  state.phraseIdx = i;
  const [tw, en] = PHRASES[i];
  return `<section class="phrase">
      <p class="cap">${esc(caption)}</p>
      <p class="tw truku" id="ph-tw">${esc(tw)}</p>
      <p class="zh" id="ph-en">${esc(en)}</p>
      <div class="ph-controls">
        <button class="ph-play" id="ph-play">▶　Hear it spoken</button>
        <button class="ph-next" id="ph-next">Another phrase</button>
      </div>
      <p class="ph-tip">Recorded by a Truku language teacher. If you hear nothing,
         check your volume and the silent switch on your phone.</p>
      <audio id="ph-audio" preload="auto" playsinline src="${AUDIO_DIR}/${i+1}${AUDIO_EXT}"></audio>
    </section>`;
}

function setPlay(label){ const b = $("ph-play"); if (b) b.textContent = label; }

function setPhrase(i){
  state.phraseIdx = i;
  $("ph-tw").textContent = PHRASES[i][0];
  $("ph-en").textContent = PHRASES[i][1];
  const a = $("ph-audio");
  a.pause(); a.src = `${AUDIO_DIR}/${i+1}${AUDIO_EXT}`; a.load();
  setPlay("▶　Hear it spoken");
}

function bindPhrase(){
  const next = $("ph-next"), play = $("ph-play"), audio = $("ph-audio");
  if (!next) return;
  next.addEventListener("click", ()=>{
    let i; do { i = Math.floor(Math.random()*PHRASES.length); } while (i === state.phraseIdx);
    setPhrase(i);
  });
  // 手機瀏覽器禁止自動播放，一定要使用者自己點
  play.addEventListener("click", async ()=>{
    if (!audio.paused){ audio.pause(); audio.currentTime = 0; setPlay("▶　Hear it spoken"); return; }
    try { setPlay("Playing…"); await audio.play(); }
    catch(e){ setPlay("Could not play — check volume"); }
  });
  audio.addEventListener("ended", ()=> setPlay("▶　Hear it again"));
  audio.addEventListener("error", ()=> setPlay("Audio unavailable"));
}

/* Dowriq Utux — Eye of the Ancestors */
function eyeSVG(size){
  return `<svg class="eye" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M50 4 L96 50 L50 96 L4 50 Z" fill="none" stroke="#96271F" stroke-width="3.5"/>
    <path d="M50 19 L81 50 L50 81 L19 50 Z" fill="none" stroke="#1A1512" stroke-width="3"/>
    <path d="M50 33 L67 50 L50 67 L33 50 Z" fill="#96271F"/>
    <path d="M50 43 L57 50 L50 57 L43 50 Z" fill="#F2EEE3"/>
  </svg>`;
}

render();
</script>
</body>
</html>
