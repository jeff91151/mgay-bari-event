<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2EEE3">
<title>Dowriq Utux — Six things the ancestors watch｜Truku culture</title>
<meta name="description" content="Truku Indigenous culture from eastern Taiwan, told through six things: the watchtower, the house, the hunt, the snare, the loom and Mgay Bari. With spoken Truku.">

<!-- ==========================================================
     英文版 — 國際交流用。與 index.html 完全獨立：
     不使用 LIFF、不需要 LINE、不收任何資料、不連後端。
     QR 直接印：https://jeff91151.github.io/mgay-bari-event/en.html

     結構上的想法：整頁就是一塊正在被織出來的布。
     螢幕底部那條 loom 每讀完一段就織出一個該段顏色的菱形。
     ========================================================== -->

<style>
:root{
  --bone:#F2EEE3;          /* 未染色的苧麻，太魯閣織品的底 */
  --paper:#FFFFFF;
  --ink:#1A1512;
  --red:#96271F;           /* 茜草紅 */
  --muted:#6E6559;
  --line:#DCD4C3;
  --acc:#96271F;
  --loom-h:30px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;background:var(--bone);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17.5px;line-height:1.72;
  padding-bottom:calc(var(--loom-h) + env(safe-area-inset-bottom,0px));
}
.truku{font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;}
.wrap{max-width:660px;margin:0 auto;padding:0 22px;}

/* ========== 開場 ========== */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 22px 60px;gap:0;}
.hero .eye{width:min(46vw,190px);height:auto;display:block;margin-bottom:34px;}
.hero .eye path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.2s .25s ease-out forwards;}
.hero .eye path:nth-child(2){animation-delay:.75s;}
.hero .eye .fill{opacity:0;animation:fadein .7s 2.1s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes fadein{to{opacity:1;}}

.hero h1{font-size:clamp(40px,13vw,68px);line-height:1;margin:0;font-weight:700;color:var(--red);}
.hero .gloss{font-size:15px;color:var(--muted);margin:12px 0 0;letter-spacing:.14em;text-transform:uppercase;}
.hero .say{max-width:30em;margin:34px auto 0;font-size:19px;line-height:1.65;}
.hero .say em{font-style:normal;color:var(--red);font-weight:600;}
.hero .cue{margin-top:46px;font-size:13px;color:var(--muted);letter-spacing:.16em;
  text-transform:uppercase;animation:nudge 2.4s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.55;}50%{transform:translateY(7px);opacity:1;}}

/* ========== 分隔的織紋 ========== */
.p-out{fill:none;stroke:var(--acc);stroke-width:2.2;}
.p-ink{fill:var(--ink);}
.p-eye{fill:var(--bone);}
.divider{display:block;width:100%;height:30px;margin:0 0 42px;
  opacity:0;transform:scaleX(.3);transform-origin:left center;
  transition:opacity .5s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);}
.seen .divider{opacity:1;transform:scaleX(1);}

/* ========== 每一段 ========== */
.topic{padding:30px 0 70px;}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
.eyebrow b{color:var(--acc);}
.term{font-size:clamp(36px,11.5vw,56px);line-height:1.03;margin:0;font-weight:700;color:var(--acc);}
.en{font-size:19px;font-weight:700;margin:10px 0 0;}
.hook{font-size:22px;line-height:1.5;margin:22px 0 0;font-weight:600;max-width:24em;}
.topic p.body{margin:20px 0 0;}
.topic p.body b{color:var(--acc);font-weight:700;}
figure{margin:30px 0 0;}
figure img{width:100%;aspect-ratio:16/10;object-fit:cover;border:2px solid var(--ink);display:block;}
figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55;}
.keys{display:flex;flex-wrap:wrap;gap:7px;margin:26px 0 0;}
.key{border:1px solid var(--line);background:var(--paper);padding:5px 10px;font-size:13.5px;line-height:1.5;}
.key b{color:var(--acc);font-weight:700;font-size:14.5px;}

/* 捲到才浮現 */
.rise{opacity:0;transform:translateY(16px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1);}
.seen .rise{opacity:1;transform:none;}
.seen .rise:nth-child(2){transition-delay:.06s;}
.seen .rise:nth-child(3){transition-delay:.12s;}
.seen .rise:nth-child(4){transition-delay:.18s;}

/* ========== 底部織線 ========== */
.loom{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--loom-h);
  background:var(--bone);border-top:2px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;justify-content:center;gap:0;}
.loom svg{display:block;height:calc(var(--loom-h) - 4px);width:100%;max-width:420px;}
.loom .dia{fill:none;stroke:var(--line);stroke-width:1.6;transition:fill .6s ease,stroke .6s ease;}
.loom .dia.on{stroke-width:0;}
.loom .thread{stroke:var(--line);stroke-width:1.2;}

/* ========== 測驗 ========== */
.quizwrap{padding:20px 0 60px;}
.quizwrap h2{font-size:26px;margin:0 0 6px;}
.quizwrap .sub{color:var(--muted);font-size:15px;margin:0 0 28px;}
.qcard{background:var(--paper);border:2px solid var(--ink);padding:24px 20px;}
.qnum{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;}
.qtext{font-size:19px;font-weight:600;line-height:1.55;margin:0 0 20px;}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:58px;
  padding:14px 16px;margin-bottom:9px;background:var(--bone);color:var(--ink);
  border:1.5px solid var(--line);font:inherit;font-size:16px;line-height:1.5;
  text-align:left;cursor:pointer;}
.opt .mk{font-weight:700;color:var(--acc);flex:none;}
.opt:hover:not(:disabled){border-color:var(--ink);}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}
.opt.ok{background:#E6EFE6;border-color:#2E5A38;color:#1F3F26;}
.opt.ok .mk{color:#2E5A38;}
.opt.no{background:#E9E2D6;border-color:var(--muted);color:var(--muted);}
.qfeed{margin:16px 0 0;font-size:15px;color:var(--muted);min-height:1.6em;}
.qdots{display:flex;gap:7px;justify-content:center;margin-top:20px;}
.qdot{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--line);}
.qdot.hit{background:#2E5A38;border-color:#2E5A38;}
.qdot.miss{background:var(--line);}
.qscore{text-align:center;padding:16px 0 0;}
.qscore .big{font-size:40px;font-weight:700;margin:6px 0 0;color:var(--red);}

/* ========== 族語 ========== */
.phrase{background:var(--ink);color:var(--bone);padding:28px 22px;}
.phrase .cap{font-size:12px;color:#B9AE9B;margin:0 0 14px;letter-spacing:.14em;text-transform:uppercase;}
.phrase .tw{font-size:clamp(24px,7vw,32px);line-height:1.25;margin:0;font-weight:700;color:#fff;}
.phrase .gl{font-size:17px;margin:10px 0 0;color:#D8CEBC;}
.ph-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.ph-play{flex:2 1 180px;min-height:54px;background:var(--bone);color:var(--ink);
  border:none;font:inherit;font-size:16px;font-weight:700;cursor:pointer;}
.ph-play:hover{background:#fff;}
.ph-next{flex:1 1 130px;min-height:54px;background:transparent;border:1.5px solid #6F6558;
  color:var(--bone);font:inherit;font-size:15px;cursor:pointer;}
.ph-next:hover{border-color:var(--bone);}
.ph-play:focus-visible,.ph-next:focus-visible{outline:3px solid var(--bone);outline-offset:2px;}
.ph-tip{font-size:13px;color:#9E9484;margin:14px 0 0;line-height:1.55;}

.closing{padding:64px 0 40px;text-align:center;}
.closing .eye{margin:0 auto 18px;display:block;}
.closing p{max-width:26em;margin:0 auto;font-size:17px;}
footer{padding:30px 0 40px;font-size:12px;color:var(--muted);text-align:center;line-height:1.9;}
footer a{color:var(--muted);}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
  .rise,.divider{opacity:1 !important;transform:none !important;}
  .hero .eye path{stroke-dashoffset:0 !important;}
  .hero .eye .fill{opacity:1 !important;}
  html{scroll-behavior:auto;}
}
</style>
</head>
<body>

<!-- ============ 開場 ============ -->
<header class="hero">
  <svg class="eye" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 3 L97 50 L50 97 L3 50 Z" fill="none" stroke="#96271F" stroke-width="2.6"/>
    <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="none" stroke="#1A1512" stroke-width="2.4"/>
    <path class="fill" d="M50 34 L66 50 L50 66 L34 50 Z" fill="#96271F"/>
    <path class="fill" d="M50 44 L56 50 L50 56 L44 50 Z" fill="#F2EEE3"/>
  </svg>
  <h1 class="truku">Dowriq Utux</h1>
  <p class="gloss">Eye of the ancestors</p>
  <p class="say">This diamond runs along the edge of every piece of Truku cloth.
     It means <em>someone is watching over you</em> — and it has been on your screen
     since the moment you opened this page.</p>
  <p class="say" style="margin-top:18px">Here are six things it watches.</p>
  <p class="cue">Scroll ↓</p>
</header>

<main id="main"></main>

<!-- ============ 底部的織線 ============ -->
<div class="loom" aria-hidden="true">
  <svg id="loom" viewBox="0 0 420 26" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script>
/* ============================================================
   內容
   ============================================================ */
const TOPICS = [
  { k:"tower", term:"Daka", en:"The watchtower", acc:"#23386E",
    hook:"The word for the tower is the same as the word for what you do from it.",
    img:"img/tower.jpg",
    credit:"Mgay Bari 2026 event site. Courtesy of the Association.",
    body:[
      "Truku villages were built to be watched over. At the entrance, or on the highest ground, stood a tall tower. Its name, <b>Daka</b>, is not a noun borrowed from somewhere else — it is simply the act of standing high and looking out.",
      "The tower guarded the <b>Sapah</b>, the house and everyone in it. Young men took turns keeping watch through the night beside their elders, learning to read a shift in the wind, a movement in the grass. It was part of becoming a warrior.",
      "The people's own name carries the same shape of meaning. <b>Truku</b> is a terrace on a mountainside — a place fit to live, and exactly the ground you want when you are watching for someone's approach. Keeping watch is written into the name of the people."
    ],
    keys:[["Daka","watchtower; to stand high and look out"],["Sapah","house, home"],["Truku","mountainside terrace, a place fit to live"]],
    q:"What does <i>Daka</i> mean?",
    opts:["Reading the stars to predict weather","Standing high to look out and keep the village safe","Storing the community's harvest"],
    a:1 },

  { k:"house", term:"Sapah", en:"The house", acc:"#94611E",
    hook:"Half of the house is underground. The fire in the middle of it is never allowed to go out.",
    img:"img/house.jpg",
    credit:"Indigenous Peoples Cultural Development Center, via Taiwan Cultural Memory Bank (CC BY-NC).",
    body:[
      "A traditional Truku house is dug down into the ground before it is built up. The semi-subterranean form holds cool air through summer and warmth through winter, and keeps the building low under the mountain winds. The environmental reasoning is in the architecture itself.",
      "At the centre of every <b>Sapah</b> is a hearth that burns all year. Food is cooked there and the family gathers around it, but its real work is slower than that: it is where elders hand down history and <b>Gaya</b>, the inherited body of law and discipline. A fire that keeps going stands for a family line that keeps going.",
      "The Truku also hold that the ancestors speak through dreams. A house, then, is not only shelter. It is where you sleep, and where you are spoken to."
    ],
    keys:[["Sapah","house, home"],["Gaya","ancestral law and discipline"]],
    q:"Inside a Truku house, what is the sacred centre where history and <i>Gaya</i> pass down?",
    opts:["The stone steps at the entrance","The hearth that never goes out","The roof space where game is stored"],
    a:1 },

  { k:"archery", term:"Smbu buji", en:"The hunt", acc:"#3860D9",
    hook:"The Truku word for hunting does not mean killing.",
    img:"img/archery.jpg",
    credit:"Truku Traditional Archery &amp; Arts Association, New Taipei City.",
    body:[
      "<b>Tmsamat</b> is usually translated as hunting, and that translation loses almost everything. What it actually describes is living attentively in the forest, alongside the animals in it.",
      "A hunter keeps <b>Gaya</b> strictly before he goes up — the prohibitions, the obligations. Everything taken is understood as a gift from the <b>Utux</b>, the ancestral spirits, which makes greed a kind of insult. The governing rule of Tmsamat is to take only what is needed and never to empty a place.",
      "It is a working definition of sustainability, arrived at several centuries before anyone needed the word."
    ],
    keys:[["Smbu buji","to shoot a bow"],["Tmsamat","hunting"],["Utux","ancestral spirits"],["Gaya","prohibitions and law"]],
    q:"What does <i>Tmsamat</i> actually mean?",
    opts:["Taking as much game as possible, to prove your strength","Living attentively in the forest alongside the animals, taking only what is needed","Driving every animal out of the forest"],
    a:1 },

  { k:"trap", term:"Powsa qlubung", en:"The snare", acc:"#237A41",
    hook:"Reading the animal takes far longer than catching it.",
    img:"img/trap.jpg",
    credit:"Association archive. The photograph records a trap-setting workshop held with the Bunun people; the technique is closely comparable.",
    body:[
      "Before a single branch is bent, the hunter has spent a long time reading: which paths the animal walks, at what hour, how it moves when it is unhurried. The <b>Qlubung</b> goes where that reading says it should go, and nowhere else.",
      "The mechanism is built from whatever is at hand — the spring of a bent sapling, the weight of a stone slab — and different animals demand entirely different constructions. It is precise work, and quiet work.",
      "What happens afterwards matters as much as the catch. The animal is carried back and shared out across the village. That sharing, given with no expectation of return, is one of the foundations the society rests on."
    ],
    keys:[["Powsa qlubung","to set a snare"],["Qlubung","snare, trap"]],
    q:"After a successful catch, what would a hunter always do?",
    opts:["Carry it back and share it across the village","Hide it in the forest as a private store","Trade it to a neighbouring village for weapons"],
    a:0 },

  { k:"weaving", term:"Tminun", en:"The loom", acc:"#DA0030",
    hook:"A woman who could not weave could not cross into the afterlife.",
    img:"img/weaving.jpg",
    credit:"Hualien County Cultural Affairs Bureau, via Taiwan Cultural Memory Bank (CC0).",
    body:[
      "Truku weaving is done on a portable horizontal backstrap loom, the <b>Ubung</b> — the weaver braces it with her feet and takes the tension through her own body. The background is undyed ramie; only the pattern threads are dyed. That is the palette you have been reading on this whole time.",
      "Mastery was not a hobby. It was the measure by which a community judged a woman's ability and standing, and the condition for receiving the facial tattoo, <b>Ptasan</b>. The tattoo in turn was her passage across the Rainbow Bridge, <b>Hakaw Utux</b>, back to the ancestors after death. The division was strict: men hunted, women wove, and men were not to touch the tools.",
      "The diamond is the oldest motif in the cloth. It is <b>Dowriq Utux</b> — eyes. The ancestors, watching from above, and a standing reminder to keep Gaya.",
      "Look at the bottom of your screen. It has been weaving itself while you read."
    ],
    keys:[["Tminun","weaving"],["Ubung","backstrap loom"],["Ptasan","facial tattoo"],["Hakaw Utux","the Rainbow Bridge"],["Dowriq Utux","eye of the ancestors"]],
    q:"What did mastering weaving earn a woman, that she needed to cross the Rainbow Bridge?",
    opts:["A hunting knife of her own","The right to receive the facial tattoo (Ptasan)","Leadership of the village"],
    a:1 },

  { k:"mgaybari", term:"Mgay Bari", en:"The thanksgiving", acc:"#96271F",
    hook:"Everything above comes back to one day in the year.",
    img:"img/mgaybari.jpg",
    credit:"New Taipei City Joint Indigenous Cultural Festival, 2025. Courtesy of the Association.",
    body:[
      "When the harvest is in, the community offers the best of the crops and the game to the <b>Utux rudan</b>, the spirits of the ancestors, in thanks for a year of protection. That is <b>Mgay Bari</b>.",
      "It is more than a harvest festival. It is the day a community scattered across a year comes back into one place, and the day Gaya is handed to whoever is young enough to carry it next. In the great circle dance everyone holds hands — about as direct a statement as a people can make about being one.",
      "The tower, the hearth, the hunt, the snare, the loom: none of them are exhibits. They are what is being given thanks for."
    ],
    keys:[["Mgay Bari","the thanksgiving ceremony"],["Utux rudan","spirits of the ancestors"],["Gaya","ancestral law"]],
    q:"At the heart of Mgay Bari, who is being thanked?",
    opts:["A sun god","The ancestral spirits (Utux / Utux rudan)","The chief of a neighbouring village"],
    a:1 }
];

const PHRASES = [
  ["Embiyax su hug?","How are you?"],["Embiyax ku.","I'm well."],
  ["Mhuway su balay.","Thank you."],["Ini huya!","It's all right."],
  ["Ini ta bi kla.","I'm sorry."],["Iya qsiqa!","Don't be shy!"],
  ["Swayay ta han!","Goodbye!"],["Laqi ku Truku ka yaku.","I am a Truku child."],
  ["Mkla ku rmngaw kari Truku.","I can speak Truku."],["Piya tuki ka sayang da?","What time is it?"],
  ["Gaga inu ka saan ngangut hug?","Where is the toilet?"],["Mha su inu?","Where are you going?"],
  ["Ima ka hangan su?","What is your name?"],["Mkla ku rmgrig.","I can dance."],
  ["Mkla ku meuyas.","I can sing."],["Mkla ku tminun.","I can weave."]
];

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================================================
   畫面
   ============================================================ */
function dividerSVG(){
  return `<svg class="divider" viewBox="0 0 440 30" preserveAspectRatio="none" aria-hidden="true">
    <defs><pattern id="d${Math.random().toString(36).slice(2,7)}"></pattern></defs>
    ${[...Array(11)].map((_,i)=>{
      const x=i*40+20;
      return `<path class="p-out" d="M${x} 6 L${x+19} 15 L${x} 24 L${x-19} 15 Z"/>
              <path class="p-ink" d="M${x} 11 L${x+9} 15 L${x} 19 L${x-9} 15 Z"/>
              <circle class="p-eye" cx="${x}" cy="15" r="1.6"/>`;
    }).join("")}
  </svg>`;
}

function render(){
  $("#main").innerHTML = TOPICS.map((t,i)=>`
    <section class="topic" id="t-${t.k}" style="--acc:${t.acc}">
      <div class="wrap">${dividerSVG()}</div>
      <div class="wrap">
        <p class="eyebrow rise">${String(i+1).padStart(2,"0")} &nbsp;/&nbsp; <b>${esc(t.term)}</b></p>
        <h2 class="term truku rise">${esc(t.term)}</h2>
        <p class="en rise">${esc(t.en)}</p>
        <p class="hook rise">${esc(t.hook)}</p>
        <figure class="rise">
          <img src="${esc(t.img)}" alt="${esc(t.en)}" loading="lazy" decoding="async">
          <figcaption>${t.credit}</figcaption>
        </figure>
        ${t.body.map(p=>`<p class="body rise">${p}</p>`).join("")}
        <div class="keys rise">${t.keys.map(([a,b])=>
          `<span class="key"><b class="truku">${esc(a)}</b> ${esc(b)}</span>`).join("")}</div>
      </div>
    </section>`).join("")
  + `
    <section class="topic" id="quizsec" style="--acc:#96271F">
      <div class="wrap">${dividerSVG()}</div>
      <div class="wrap quizwrap">
        <h2 class="rise">Six questions</h2>
        <p class="sub rise">Every answer is somewhere above.</p>
        <div class="rise" id="qbox"></div>
        <div class="qdots" id="qdots"></div>
      </div>
    </section>

    <section class="topic" style="--acc:#1A1512">
      <div class="wrap">
        <div class="phrase" id="phrase"></div>
      </div>
    </section>

    <div class="wrap closing">
      ${eyeSVG(74)}
      <p>Mgay Bari is held each year by the Truku community.
         If you are in Taiwan in the autumn, you are welcome at it.</p>
    </div>

    <footer>
      © Truku Traditional Archery &amp; Arts Association, New Taipei City<br>
      新北市原住民傳藝射箭推廣協會　·　<a href="index.html">中文版</a>
    </footer>`;
}

function eyeSVG(size){
  return `<svg class="eye" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 4 L96 50 L50 96 L4 50 Z" fill="none" stroke="#96271F" stroke-width="3.5"/>
    <path d="M50 19 L81 50 L50 81 L19 50 Z" fill="none" stroke="#1A1512" stroke-width="3"/>
    <path d="M50 33 L67 50 L50 67 L33 50 Z" fill="#96271F"/>
    <path d="M50 43 L57 50 L50 57 L43 50 Z" fill="#F2EEE3"/>
  </svg>`;
}

/* ============================================================
   底部織線：每讀過一段就織出一個該段顏色的菱形
   ============================================================ */
function buildLoom(){
  const n = TOPICS.length, step = 420/(n+1);
  $("#loom").innerHTML =
    `<line class="thread" x1="0" y1="13" x2="420" y2="13"/>` +
    TOPICS.map((t,i)=>{
      const x = step*(i+1);
      return `<path class="dia" id="dia-${t.k}" d="M${x} 3 L${x+11} 13 L${x} 23 L${x-11} 13 Z"/>`;
    }).join("");
}
function weave(k, colour){
  const d = document.getElementById("dia-"+k);
  if (d && !d.classList.contains("on")){
    d.classList.add("on");
    d.style.fill = colour;
  }
}

/* ============================================================
   測驗：一次一題
   ============================================================ */
let qi = 0, hits = 0;
function renderQ(){
  if (qi >= TOPICS.length){
    $("#qbox").innerHTML = `<div class="qcard qscore">
        ${eyeSVG(64)}
        <p style="margin:0;color:var(--muted);font-size:15px">You got</p>
        <p class="big">${hits} / ${TOPICS.length}</p>
        <p style="margin:10px 0 0;color:var(--muted);font-size:15px">
          ${hits===TOPICS.length ? "Mhuway su balay — thank you for reading."
            : "Everything is still above, if you want another look."}</p>
      </div>`;
    return;
  }
  const t = TOPICS[qi];
  $("#qbox").innerHTML = `<div class="qcard" style="--acc:${t.acc}">
      <p class="qnum">Question ${qi+1} of ${TOPICS.length} &nbsp;·&nbsp; ${esc(t.term)}</p>
      <p class="qtext">${t.q}</p>
      ${t.opts.map((o,i)=>`<button class="opt" data-i="${i}">
         <span class="mk">${"ABC"[i]}</span><span>${esc(o)}</span></button>`).join("")}
      <p class="qfeed" id="qfeed"></p>
    </div>`;
  $("#qbox").querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", ()=>pick(b, t)));
  paintDots();
}
function pick(btn, t){
  const box = $("#qbox");
  if (box.dataset.locked) return;
  box.dataset.locked = "1";
  const chosen = Number(btn.dataset.i), right = chosen === t.a;
  box.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled = true;
    if (i === t.a) b.classList.add("ok");
    else if (i === chosen) b.classList.add("no");
  });
  if (right) hits++;
  TOPICS[qi].got = right;
  $("#qfeed").textContent = right ? "Yes." : "The one marked above is the one.";
  paintDots();
  setTimeout(()=>{ qi++; box.dataset.locked=""; renderQ(); }, right ? 900 : 1700);
}
function paintDots(){
  $("#qdots").innerHTML = TOPICS.map((t,i)=>
    `<span class="qdot ${i<qi ? (t.got?"hit":"miss") : ""}"></span>`).join("");
}

/* ============================================================
   族語
   ============================================================ */
let pIdx = 0;
function renderPhrase(i){
  pIdx = i;
  const [tw,en] = PHRASES[i];
  $("#phrase").innerHTML = `
    <p class="cap">Say something in Truku</p>
    <p class="tw truku" id="ph-tw">${esc(tw)}</p>
    <p class="gl" id="ph-en">${esc(en)}</p>
    <div class="ph-controls">
      <button class="ph-play" id="ph-play">▶　Hear it spoken</button>
      <button class="ph-next" id="ph-next">Another one</button>
    </div>
    <p class="ph-tip">Recorded by a Truku language teacher.
       If you hear nothing, check your volume and the silent switch on your phone.</p>
    <audio id="ph-audio" preload="auto" playsinline src="audio/${i+1}.m4a"></audio>`;
  bindPhrase();
}
function bindPhrase(){
  const play = $("#ph-play"), audio = $("#ph-audio");
  const setL = t => { if (play) play.textContent = t; };
  $("#ph-next").addEventListener("click", ()=>{
    let i; do { i = Math.floor(Math.random()*PHRASES.length); } while (i === pIdx);
    renderPhrase(i);
  });
  // 手機瀏覽器一律禁止自動播放，一定要使用者自己點
  play.addEventListener("click", async ()=>{
    if (!audio.paused){ audio.pause(); audio.currentTime = 0; setL("▶　Hear it spoken"); return; }
    try { setL("Playing…"); await audio.play(); }
    catch(e){ setL("Could not play — check volume"); }
  });
  audio.addEventListener("ended", ()=> setL("▶　Hear it again"));
  audio.addEventListener("error", ()=> setL("Audio unavailable"));
}

/* ============================================================
   捲動觸發
   ============================================================ */
function observe(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if (!e.isIntersecting) return;
      e.target.classList.add("seen");
      const t = TOPICS.find(x => "t-"+x.k === e.target.id);
      if (t) weave(t.k, t.acc);
      io.unobserve(e.target);
    });
  }, { rootMargin:"0px 0px -18% 0px", threshold:0.12 });
  document.querySelectorAll(".topic").forEach(s => io.observe(s));
}

render();
buildLoom();
renderQ();
renderPhrase(Math.floor(Math.random()*PHRASES.length));
observe();
</script>
