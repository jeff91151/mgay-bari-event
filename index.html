<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9E2A21">
<title>Mgay Bari 文化導覽</title>

<!-- ==========================================================
     Mgay Bari 太魯閣族文化導覽與數位集章系統
     單一 index.html + Query Parameter 切換 5 個關卡

     QR Code 網址格式：
       https://liff.line.me/2011311323-Wj59NXZK?stage=archery
       https://liff.line.me/2011311323-Wj59NXZK?stage=trap
       https://liff.line.me/2011311323-Wj59NXZK?stage=tower
       https://liff.line.me/2011311323-Wj59NXZK?stage=house
       https://liff.line.me/2011311323-Wj59NXZK?stage=weaving

     除錯用：任何網址後面加 &debug=1 會在頁尾顯示環境資訊
     ========================================================== -->

<style>
:root{
  --bone:#F3EFE6;      /* 苧麻本色，頁面底 */
  --paper:#FFFFFF;
  --ink:#16120F;
  --red:#9E2A21;       /* 茜草紅，織紋主色 */
  --red-deep:#7A1F18;
  --forest:#2F5D3A;    /* 答對 */
  --muted:#6B6258;
  --line:#DDD6C7;
  --warm:#FBF4E4;      /* 表單區 */
  --radius:4px;
}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bone);
  color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;
  line-height:1.75;
}
.serif{font-family:"Songti TC","Noto Serif TC","Source Han Serif TC",serif;}

/* ---- 菱形織紋帶：全站唯一的視覺重點 ---- */
.weave{
  height:16px;
  background-color:var(--bone);
  background-image:
    repeating-linear-gradient( 45deg, var(--red) 0 2px, transparent 2px 8px),
    repeating-linear-gradient(-45deg, var(--red) 0 2px, transparent 2px 8px),
    repeating-linear-gradient( 45deg, var(--ink) 5px 6px, transparent 6px 16px),
    repeating-linear-gradient(-45deg, var(--ink) 5px 6px, transparent 6px 16px);
  border-top:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}

.wrap{max-width:620px;margin:0 auto;padding:0 20px 48px;}

/* ---- 頁首：族語是主角 ---- */
header{padding:28px 0 22px;}
.stage-count{font-size:14px;letter-spacing:.05em;color:var(--muted);margin:0 0 10px;}
.term{
  font-size:clamp(40px,13vw,60px);
  line-height:1.05;
  margin:0;
  font-weight:700;
  color:var(--red-deep);
  letter-spacing:-.01em;
}
.term-zh{font-size:20px;margin:8px 0 0;font-weight:600;}
.subtitle{margin:6px 0 0;color:var(--muted);font-size:15px;}

/* ---- 身分列 ---- */
.who{
  display:flex;align-items:center;gap:10px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:12px 0;margin-bottom:26px;font-size:15px;
}
.who .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;}
.who.ok .dot{background:var(--forest);}
.who.warn .dot{background:#B8860B;}
.who .uid{display:block;font-size:11px;color:var(--muted);word-break:break-all;line-height:1.4;}

/* ---- 文化介紹：直接放在頁面上，不裝進卡片 ---- */
.photo{
  width:100%;aspect-ratio:16/10;object-fit:cover;
  border:2px solid var(--ink);border-radius:var(--radius);display:block;margin-bottom:20px;
}
.photo-empty{
  width:100%;aspect-ratio:16/10;border:2px dashed var(--line);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:14px;padding:16px;margin-bottom:20px;background:#EDE8DC;
}
.intro p{margin:0 0 16px;}
.intro p:last-child{margin-bottom:0;}

/* ---- 小測驗 ---- */
.quiz{
  background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);
  padding:22px 20px;margin-top:32px;
}
.quiz h2{font-size:15px;margin:0 0 4px;color:var(--red);font-weight:700;}
.question{font-size:18px;font-weight:600;margin:0 0 18px;line-height:1.6;}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;
  min-height:56px;padding:14px 16px;margin-bottom:10px;
  background:var(--bone);color:var(--ink);
  border:1.5px solid var(--line);border-radius:var(--radius);
  font:inherit;font-size:16px;line-height:1.5;text-align:left;cursor:pointer;
}
.opt:last-of-type{margin-bottom:0;}
.opt .mark{font-weight:700;color:var(--red);flex:none;}
.opt:hover:not(:disabled){border-color:var(--ink);}
.opt:focus-visible{outline:3px solid var(--red);outline-offset:2px;}
.opt:disabled{cursor:default;opacity:.55;}
.opt.is-wrong{background:#EFE7DC;border-color:var(--muted);opacity:1;}
.opt.is-wrong .mark{color:var(--muted);}
.feedback{margin:14px 0 0;font-size:15px;color:var(--muted);min-height:1px;}

/* ---- 答對後的表單 ---- */
.reward{
  background:var(--warm);border:2px solid var(--red);border-radius:var(--radius);
  padding:22px 20px;margin-top:24px;
}
.stamp{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.stamp-mark{
  width:44px;height:44px;flex:none;border:2px solid var(--red);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--red);
  font-size:20px;transform:rotate(-12deg);
}
.reward h2{font-size:19px;margin:0;}
.reward .note{font-size:15px;color:var(--muted);margin:6px 0 20px;}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;}
input[type=text],select{
  width:100%;min-height:52px;padding:12px 14px;margin-bottom:18px;
  border:1.5px solid var(--line);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);font:inherit;font-size:16px;
}
input[type=text]:focus,select:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red);}
.btn-send{
  width:100%;min-height:58px;border:none;border-radius:var(--radius);
  background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;
}
.btn-send:hover:not(:disabled){background:var(--red-deep);}
.btn-send:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.btn-send:disabled{background:var(--muted);cursor:wait;}
.err{color:var(--red);font-size:15px;margin:12px 0 0;}

/* ---- 送出成功 ---- */
.done{text-align:center;padding:34px 20px;margin-top:24px;
  border:2px solid var(--forest);border-radius:var(--radius);background:var(--paper);}
.done h2{margin:0 0 6px;font-size:22px;color:var(--forest);}
.done p{margin:0;color:var(--muted);font-size:15px;}
.done .big{font-size:26px;color:var(--ink);margin:14px 0 4px;font-weight:700;}

/* ---- 關卡總覽 ---- */
.menu-item{
  display:block;padding:18px 0;border-bottom:1px solid var(--line);
  color:var(--ink);text-decoration:none;
}
.menu-item:first-of-type{border-top:1px solid var(--line);}
.menu-item .t{font-size:24px;font-weight:700;color:var(--red-deep);}
.menu-item .z{font-size:15px;color:var(--muted);}

.backlink{display:inline-block;margin-top:24px;color:var(--red);font-size:15px;}

footer{
  border-top:1px solid var(--line);margin-top:44px;padding-top:18px;
  font-size:12px;color:var(--muted);text-align:center;line-height:1.7;
}
#debug{
  display:none;margin-top:14px;padding:12px;background:#EDE8DC;border-radius:var(--radius);
  font-family:ui-monospace,Menlo,monospace;font-size:11px;text-align:left;word-break:break-all;
}

.hidden{display:none !important;}

@keyframes press{from{transform:scale(.94) rotate(-12deg);opacity:0;}to{transform:scale(1) rotate(-12deg);opacity:1;}}
.stamp-mark{animation:press .35s ease-out;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>

<body>
<div class="weave" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <p class="stage-count" id="stage-count"></p>
    <h1 class="term serif" id="term">載入中</h1>
    <p class="term-zh" id="term-zh"></p>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="who" id="who">
    <span class="dot"></span>
    <span id="who-text">正在取得您的 LINE 身分…</span>
  </div>

  <main id="main"></main>

  <footer>
    © 新北市原住民傳藝射箭推廣協會 所有
    <div id="debug"></div>
  </footer>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ============================================================
   1. 設定
   ============================================================ */
const LIFF_ID  = "2011311323-Wj59NXZK";
const API_BASE = "";   // 之後 FastAPI 上線後填入，例如 "https://your-api.com"

/* ============================================================
   2. 五個關卡的內容
   ⚠️ 族語拼寫與文化敘述請務必請協會或耆老校訂後再正式上線。
      瞭望台的族語名稱我不敢亂填，留了空白（term 留空會只顯示中文）。
   ============================================================ */
const ORDER = ["archery", "trap", "tower", "house", "weaving"];

const STAGES = {
  archery: {
    term: "Tmsamat", termZh: "狩獵",
    title: "射箭體驗",
    subtitle: "從射箭認識傳統狩獵文化",
    image: "",           // 之後填圖片網址，例如 "img/archery.jpg"
    imageHint: "射箭場或山林照片",
    intro: [
      "傳統狩獵不只是為了獲取食物，更是學習認識山林、與自然共存的方式。獵人要能讀懂風向、足跡與季節，才有資格上山。",
      "狩獵有著嚴格的規範（Gaya），教導族人尊重生命、不貪求，並且要把獵物與部落親族共享。分享不是客套，而是維繫整個部落的方法。"
    ],
    question: "在太魯閣族文化中，傳統狩獵（Tmsamat）最強調什麼精神？",
    options: [
      "盡可能抓越多的獵物越好",
      "尊重生命，並與部落親族共享獵物",
      "只能在晚上的時候才能打獵"
    ],
    answer: 1,
    hint: "再看一次上面第二段，關於 Gaya 的部分。"
  },

  trap: {
    term: "Qlubung", termZh: "陷阱",
    title: "陷阱智慧",
    subtitle: "看懂山林留下的線索",
    image: "",
    imageHint: "傳統陷阱或獵徑照片",
    intro: [
      "設陷阱之前，獵人得先花很長的時間觀察：動物的足跡往哪個方向、什麼時間經過、常走哪一條路。讀懂這些線索，才知道該把陷阱放在哪裡。",
      "陷阱的種類會依照獵物不同而改變，獵人也必須定期巡視，避免獵物受苦或白白浪費。這些判斷通常不是用講的，而是父親帶著孩子上山，一次一次親手示範傳下來的。"
    ],
    question: "獵人在設置陷阱之前，最重要的準備工作是什麼？",
    options: [
      "先大聲呼喊，把動物趕過來",
      "觀察動物的足跡與行走路徑，判斷該把陷阱放在哪裡",
      "在同一個地方盡量多放幾個陷阱"
    ],
    answer: 1,
    hint: "關鍵在「觀察」，答案就在第一段。"
  },

  tower: {
    term: "", termZh: "瞭望台",     // TODO: 族語名稱請協會提供
    title: "瞭望台",
    subtitle: "部落的眼睛",
    image: "",
    imageHint: "瞭望台或部落遠景照片",
    intro: [
      "瞭望台通常設在部落地勢最高、視野最開闊的位置。族人在這裡守望獵場與農地，觀察雲霧與天候的變化，也在狀況發生時第一時間向部落示警。",
      "輪流守望是部落共同的責任。年輕人在瞭望台上學到的不只是警戒，而是把整個部落的安危扛在自己肩上。"
    ],
    question: "傳統部落設置瞭望台，主要的用途是什麼？",
    options: [
      "純粹是裝飾用的建築",
      "守望獵場與農地、觀察天候，並在危險來臨時向部落示警",
      "專門用來存放糧食"
    ],
    answer: 1,
    hint: "想想看站在部落最高點，能看見什麼。"
  },

  house: {
    term: "Sapah", termZh: "家屋",
    title: "傳統家屋",
    subtitle: "火塘旁的家族記憶",
    image: "",
    imageHint: "半穴居家屋或火塘照片",
    intro: [
      "太魯閣族的傳統家屋多採半穴居形式：先向下挖出地基，再以木材、石板與茅草搭建。往下挖能讓屋內冬暖夏涼，也大幅降低山區強風的影響。",
      "屋內中央設有火塘，煮食、取暖都靠它，長輩也在火塘邊對晚輩講述 Gaya 與家族的故事。家屋因此不只是住的地方，而是生活與信仰一起發生的中心。"
    ],
    question: "太魯閣族傳統家屋採用「半穴居」形式，主要的好處是什麼？",
    options: [
      "冬暖夏涼，而且能減少山區強風的影響",
      "方便隨時拆解，搬到別的地方去",
      "因為族人不會使用木材蓋房子"
    ],
    answer: 0,
    hint: "答案跟「往下挖」這個動作有關。"
  },

  weaving: {
    term: "Tminun", termZh: "織布",
    title: "苧麻織布",
    subtitle: "祖靈的眼睛",
    image: "",
    imageHint: "織布機或菱形紋布匹照片",
    intro: [
      "從種苧麻、取纖維、捻線、染色到上機織布，每一道工序都要長時間的學習與耐心。織布是太魯閣族女性重要的生命課題，不是隨手可成的手工。",
      "傳統上，女子要能織出完整的布匹，才代表具備成家的能力。最具代表性的菱形紋被視為祖靈的眼睛，象徵祖靈始終看顧著族人。"
    ],
    question: "在傳統太魯閣族社會中，織布（Tminun）對女性代表什麼意義？",
    options: [
      "只是打發時間的休閒活動",
      "是成年與成家能力的重要象徵",
      "只有頭目的女兒才可以學"
    ],
    answer: 1,
    hint: "第二段提到「才代表具備什麼能力」。"
  }
};

const TRIBES = ["太魯閣族","賽德克族","泰雅族","阿美族","布農族","排灣族","其他原住民族","漢人 / 其他"];

/* ============================================================
   3. 狀態
   ============================================================ */
const state = { stage:null, userId:"", displayName:"", loggedIn:false };
const $ = id => document.getElementById(id);

/* ============================================================
   4. 啟動：先 liff.init()，完成後才讀參數
   ============================================================ */
(async function start(){
  // init 前先偷存一份 stage 當備援（若還在 liff.state 裡會是 null，沒關係）
  stash(new URLSearchParams(location.search).get("stage"));

  try{
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });

    // ⚠️ 一定要等 init 完成，附加參數才會從 liff.state 還原出來
    state.stage = readStage();

    if (liff.isLoggedIn()){
      const p = await liff.getProfile();
      state.userId = p.userId;
      state.displayName = p.displayName;
      state.loggedIn = true;
      setWho("ok", `歡迎，${esc(p.displayName)}`, p.userId);
    } else {
      setWho("warn", "尚未登入 LINE，資料將無法計入統計");
    }
  } catch(err){
    console.error("LIFF 初始化失敗", err);
    state.stage = readStage();
    setWho("warn", "訪客模式：未透過 LINE 開啟，內容可瀏覽但不會記錄");
  }

  render();
  setupDebug();
})();

function readStage(){
  const s = new URLSearchParams(location.search).get("stage") || recall();
  stash(s);
  return (s && STAGES[s]) ? s : null;
}
function stash(v){ try{ if(v) sessionStorage.setItem("mb_stage", v); }catch(e){} }
function recall(){ try{ return sessionStorage.getItem("mb_stage"); }catch(e){ return null; } }

function setWho(cls, text, uid){
  $("who").className = "who " + cls;
  $("who-text").innerHTML = esc(text) + (uid ? `<span class="uid">ID ${esc(uid)}</span>` : "");
}

/* ============================================================
   5. 畫面
   ============================================================ */
function render(){
  state.stage ? renderStage(STAGES[state.stage]) : renderMenu();
}

function renderStage(s){
  const n = ORDER.indexOf(state.stage) + 1;
  $("stage-count").textContent = `第 ${n} 站，共 ${ORDER.length} 站`;
  $("term").textContent = s.term || s.termZh;
  $("term-zh").textContent = s.term ? s.termZh : "";
  $("subtitle").textContent = s.subtitle;
  document.title = `${s.title}｜Mgay Bari 文化導覽`;

  const media = s.image
    ? `<img class="photo" src="${esc(s.image)}" alt="${esc(s.imageHint)}">`
    : `<div class="photo-empty">${esc(s.imageHint)}</div>`;

  $("main").innerHTML = `
    ${media}
    <div class="intro">${s.intro.map(p => `<p>${esc(p)}</p>`).join("")}</div>

    <section class="quiz" id="quiz">
      <h2>小測驗</h2>
      <p class="question">${esc(s.question)}</p>
      ${s.options.map((o,i) => `
        <button class="opt" data-i="${i}">
          <span class="mark">${"ABC"[i]}</span><span>${esc(o)}</span>
        </button>`).join("")}
      <p class="feedback" id="feedback"></p>
    </section>

    <section class="reward hidden" id="reward">
      <div class="stamp">
        <span class="stamp-mark" aria-hidden="true">◆</span>
        <h2>答對了，這一站完成</h2>
      </div>
      <p class="note">請留下基本資料，接著前往「族語聊天室」向老師挑戰一句族語，就能兌換禮品。</p>

      <label for="userName">真實姓名</label>
      <input type="text" id="userName" autocomplete="name" placeholder="請輸入您的姓名">

      <label for="userTribe">您的族別</label>
      <select id="userTribe">
        <option value="" disabled selected>請選擇族別</option>
        ${TRIBES.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
      </select>

      <button class="btn-send" id="send">送出資料</button>
      <p class="err hidden" id="formErr"></p>
    </section>

    <section class="done hidden" id="done">
      <h2>資料已送出</h2>
      <p class="big" id="doneName"></p>
      <p>請前往服務台出示這個畫面兌換好禮。</p>
      <a class="backlink" href="?">看看其他關卡</a>
    </section>
  `;

  $("quiz").querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(b, s)));
  $("send").addEventListener("click", submit);
}

function renderMenu(){
  $("stage-count").textContent = "數位集章";
  $("term").textContent = "Mgay Bari";
  $("term-zh").textContent = "感恩祭文化導覽";
  $("subtitle").textContent = "請掃描各站的 QR Code 開始，或從下方選擇";
  $("main").innerHTML = ORDER.map(k => {
    const s = STAGES[k];
    return `<a class="menu-item" href="?stage=${k}">
      <span class="t serif">${esc(s.term || s.termZh)}</span>
      <span class="z">${esc(s.title)}　${esc(s.subtitle)}</span>
    </a>`;
  }).join("");
}

/* ============================================================
   6. 互動
   ============================================================ */
function answer(btn, s){
  const picked = Number(btn.dataset.i);
  if (picked === s.answer){
    $("quiz").classList.add("hidden");
    $("reward").classList.remove("hidden");
    $("reward").scrollIntoView({ behavior:"smooth", block:"start" });
  } else {
    btn.disabled = true;
    btn.classList.add("is-wrong");
    $("feedback").textContent = "這個不是。" + s.hint;
  }
}

async function submit(){
  const name  = $("userName").value.trim();
  const tribe = $("userTribe").value;
  const err   = $("formErr");
  const btn   = $("send");

  if (!name){  showErr(err, "請填寫姓名"); $("userName").focus(); return; }
  if (!tribe){ showErr(err, "請選擇族別"); $("userTribe").focus(); return; }
  err.classList.add("hidden");

  const payload = {
    stage: state.stage,
    userId: state.userId,
    lineName: state.displayName,
    realName: name,
    tribe: tribe,
    submittedAt: new Date().toISOString()
  };

  btn.disabled = true;
  btn.textContent = "送出中…";

  try{
    if (API_BASE){
      const res = await fetch(API_BASE + "/api/checkin", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } else {
      console.log("尚未設定 API_BASE，以下為將送出的資料：", payload);
    }
    $("reward").classList.add("hidden");
    $("doneName").textContent = name;
    $("done").classList.remove("hidden");
    $("done").scrollIntoView({ behavior:"smooth", block:"center" });
  } catch(e){
    console.error(e);
    btn.disabled = false;
    btn.textContent = "送出資料";
    showErr(err, "送出失敗，請確認網路後再按一次");
  }
}

function showErr(el, msg){ el.textContent = msg; el.classList.remove("hidden"); }

/* ============================================================
   7. 除錯：網址加 &debug=1
   ============================================================ */
function setupDebug(){
  if (new URLSearchParams(location.search).get("debug") !== "1") return;
  const box = $("debug");
  box.style.display = "block";
  let inClient = "n/a", os = "n/a", ver = "n/a";
  try{ inClient = liff.isInClient(); os = liff.getOS(); ver = liff.getVersion(); }catch(e){}
  box.textContent =
    "URL: " + location.href +
    "\nstage: " + state.stage +
    "\nisInClient: " + inClient +
    "\nisLoggedIn: " + state.loggedIn +
    "\nOS: " + os + " / LIFF " + ver;
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
