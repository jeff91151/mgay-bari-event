<style>
:root{
  --bone:#F2EEE3;      /* 苧麻本色 */
  --paper:#FFFFFF;
  --ink:#1A1512;
  --red:#96271F;       /* 茜草紅 */
  --red-deep:#741D17;
  --forest:#2E5A38;
  --muted:#6E6559;
  --line:#DCD4C3;
  --warm:#FAF3E2;
  --acc:#96271F;        /* 站台識別色，進入各站時由 JS 換掉 */
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bone);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.8;
}
/* 族語（拉丁字母）專用襯線體，和中文黑體明確區隔 */
.truku{font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;}

/* ---------- 開場畫面 ---------- */
#splash{position:fixed;inset:0;z-index:100;background:var(--bone);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:24px;transition:opacity .45s ease;}
#splash img{width:min(74vw,300px);height:auto;display:block;}
#splash p{margin:0;font-size:14px;color:var(--muted);letter-spacing:.12em;}
#splash.gone{opacity:0;pointer-events:none;}

/* ---------- 菱形紋 ---------- */
.p-bg{fill:var(--bone);}
.p-ink{fill:var(--ink);}
.p-eye{fill:var(--bone);}
.p-out{fill:none;stroke:var(--red);stroke-width:2.2;}
.p-tri{fill:var(--red);}
.p-rule{fill:none;stroke:var(--red);stroke-width:1.3;}
.band{display:block;width:100%;height:34px;}
.rule{display:block;width:100%;height:14px;margin:34px 0 26px;}

.wrap{max-width:620px;margin:0 auto;padding:0 20px;}

/* ---------- 活動識別 ---------- */
.masthead{padding:28px 16px 20px;}
.masthead img{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;}

/* ---------- 進度 ---------- */
.progress{display:flex;align-items:center;gap:14px;padding:26px 0 18px;}
.pips{display:flex;gap:9px;}
.pip{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--line);background:transparent;}
.pip.done{background:var(--red);border-color:var(--red);}
.pip.now{background:var(--acc);border-color:var(--acc);}
.progress .label{font-size:13px;color:var(--muted);letter-spacing:.03em;}

/* ---------- 標題 ---------- */
.term{font-size:clamp(38px,12.5vw,58px);line-height:1.04;margin:0;font-weight:700;color:var(--acc);}
/* 中文名做成海報上那種色帶 */
.term-zh{display:inline-block;background:var(--acc);color:var(--bone);
  font-size:19px;font-weight:700;padding:6px 14px;margin:14px 0 0;}
.story-title{font-size:16px;color:var(--muted);margin:4px 0 0;}
/* 總覽頁：上方已有 logo，就不再重複 Mgay Bari 大字 */
header.is-menu .term{display:none;}
header.is-menu .term-zh{background:none;color:var(--ink);font-size:32px;padding:0;margin:0;}

/* ---------- 族語關鍵字 ---------- */
.keys{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;}
.key{border:1px solid var(--line);background:var(--paper);padding:6px 11px;font-size:14px;line-height:1.5;}
.key b{color:var(--red);font-weight:700;font-size:15px;}

/* ---------- 身分 ---------- */
.who{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:11px 0;margin:22px 0 28px;font-size:14px;color:var(--muted);
  display:flex;align-items:center;gap:9px;}
.who .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
.who.ok .dot{background:var(--forest);}
.who.warn .dot{background:#B07A12;}

/* ---------- 內容 ---------- */
.photo{width:100%;aspect-ratio:16/10;object-fit:cover;border:2px solid var(--ink);display:block;margin-bottom:8px;}
.credit{font-size:12px;color:var(--muted);margin:0 0 22px;line-height:1.6;}
.photo-empty{width:100%;aspect-ratio:16/10;border:2px dashed var(--line);background:#E8E2D4;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;
  color:var(--muted);font-size:14px;margin-bottom:22px;}
.intro p{margin:0 0 18px;}
.intro p:last-child{margin-bottom:0;}

/* ---------- 測驗 ---------- */
.quiz{background:var(--paper);border:2px solid var(--ink);padding:24px 20px;}
.quiz h2{font-size:15px;margin:0 0 6px;color:var(--acc);font-weight:700;}
.question{font-size:18px;font-weight:600;line-height:1.65;margin:0 0 20px;}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;min-height:58px;
  padding:15px 16px;margin-bottom:10px;background:var(--bone);color:var(--ink);
  border:1.5px solid var(--line);font:inherit;font-size:16px;line-height:1.55;
  text-align:left;cursor:pointer;}
.opt:last-of-type{margin-bottom:0;}
.opt .mk{font-weight:700;color:var(--acc);flex:none;}
.opt:hover:not(:disabled){border-color:var(--ink);}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px;}
.opt:disabled{cursor:default;}
.opt.wrong{background:#E9E2D6;border-color:var(--muted);color:var(--muted);}
.opt.wrong .mk{color:var(--muted);}
.feedback{margin:15px 0 0;font-size:15px;color:var(--muted);}

/* ---------- 表單 ---------- */
.reward{background:var(--warm);border:2px solid var(--acc);padding:24px 20px;}
.reward .head{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.reward h2{font-size:20px;margin:0;}
.reward .note{color:var(--muted);font-size:15px;margin:0 0 22px;}
.prefill{font-size:14px;color:var(--acc);background:var(--paper);border-left:3px solid var(--acc);
  padding:10px 12px;margin:0 0 20px;line-height:1.6;}
label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;}
input[type=text],select{width:100%;min-height:54px;padding:13px 14px;margin-bottom:18px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  font:inherit;font-size:16px;border-radius:0;-webkit-appearance:none;appearance:none;}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px;background-size:6px 6px;background-repeat:no-repeat;}
input[type=text]:focus,select:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc);}
.btn{width:100%;min-height:58px;border:none;background:var(--acc);color:#fff;
  font:inherit;font-size:18px;font-weight:700;cursor:pointer;}
.btn:hover:not(:disabled){filter:brightness(.85);}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.btn:disabled{background:var(--muted);cursor:wait;}
.btn-ghost{width:100%;min-height:52px;background:transparent;border:1.5px solid var(--ink);
  color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;margin-top:22px;}
.btn-ghost:hover{background:var(--ink);color:var(--bone);}
.err{color:var(--red);font-size:15px;margin:13px 0 0;font-weight:600;}

/* ---------- 完成 ---------- */
.done{text-align:center;padding:8px 0 0;}
.done .eye{margin:0 auto 6px;display:block;}
.done h2{margin:0;font-size:22px;color:var(--forest);}
.done .name{font-size:28px;font-weight:700;margin:10px 0 2px;}
.done .sub{color:var(--muted);font-size:15px;margin:0;}
.pending{font-size:14px;color:var(--red-deep);background:var(--warm);border:1px solid var(--red);
  padding:12px 14px;margin:16px 0 0;line-height:1.6;text-align:left;}
.next{border:2px solid var(--ink);background:var(--paper);padding:22px 20px;margin-top:30px;text-align:left;}
.next h3{margin:0 0 8px;font-size:18px;}
.next p{margin:0;color:var(--muted);font-size:15px;}

/* ---------- 族語片語 ---------- */
.phrase{background:var(--ink);color:var(--bone);padding:24px 20px;margin-top:14px;text-align:left;}
.phrase .cap{font-size:13px;color:#B9AE9B;margin:0 0 12px;}
.phrase .tw{font-size:26px;line-height:1.35;margin:0;font-weight:700;color:#fff;}
.phrase .zh{font-size:17px;margin:8px 0 0;color:#D8CEBC;}
.phrase .ph-note{font-size:13px;margin:6px 0 0;color:#9E9484;}
.ph-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.ph-play{flex:2 1 170px;min-height:54px;background:var(--bone);color:var(--ink);
  border:none;font:inherit;font-size:16px;font-weight:700;cursor:pointer;}
.ph-play:hover{background:#fff;}
.ph-next{flex:1 1 120px;min-height:54px;background:transparent;border:1.5px solid #6F6558;
  color:var(--bone);font:inherit;font-size:15px;cursor:pointer;}
.ph-next:hover{border-color:var(--bone);}
.ph-play:focus-visible,.ph-next:focus-visible{outline:3px solid var(--bone);outline-offset:2px;}
.ph-tip{font-size:13px;color:#9E9484;margin:12px 0 0;line-height:1.6;}

/* ---------- 總覽 ---------- */
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:18px 0;
  border:none;border-bottom:1px solid var(--line);background:transparent;
  font:inherit;text-align:left;cursor:pointer;color:var(--ink);}
.menu-item:first-of-type{border-top:1px solid var(--line);}
.menu-item .mk-dot{width:13px;height:13px;transform:rotate(45deg);flex:none;}
.menu-item .n{flex:1;}
.menu-item .t{display:block;font-size:25px;font-weight:700;line-height:1.2;}
.menu-item .z{display:block;font-size:15px;color:var(--muted);}
.menu-item .st{flex:none;font-size:13px;color:var(--muted);}
.menu-item .st.ok{color:var(--forest);font-weight:700;}

.locked{background:var(--paper);border:2px dashed var(--line);padding:24px 20px;text-align:center;}
.locked p{margin:0 0 4px;font-weight:700;}
.locked span{color:var(--muted);font-size:15px;}

footer{margin-top:40px;padding:18px 0 44px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8;}
#debug{display:none;margin-top:14px;padding:12px;background:#E8E2D4;text-align:left;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;white-space:pre-wrap;}
.hidden{display:none !important;}

@keyframes bloom{from{opacity:0;transform:scale(.88);}to{opacity:1;transform:scale(1);}}
.done .eye{animation:bloom .45s ease-out;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>

const state = { stage:null, scanned:false, userId:"", displayName:"", loggedIn:false, phraseIdx:0 };
const $ = id => document.getElementById(id);

/* 開場畫面：至少顯示 0.8 秒，避免一閃而過；最多 6 秒，避免卡死 */
const splashAt = Date.now();
let splashDone = false;
function hideSplash(){
  if (splashDone) return;
  splashDone = true;
  const el = $("splash");
  if (!el) return;
  setTimeout(()=>{
    el.classList.add("gone");
    setTimeout(()=> el.remove(), 500);
  }, Math.max(0, 800 - (Date.now() - splashAt)));
}
setTimeout(hideSplash, 6000);

/* 測試用：網址加 &reset=1 可以把本機的集章紀錄清空，重新玩一次 */
function maybeReset(){
  if (new URLSearchParams(location.search).get("reset") !== "1") return false;
  try{
    localStorage.removeItem("mb_done_v1");
    localStorage.removeItem("mb_profile_v1");
    localStorage.removeItem(K_QUEUE);
  }catch(e){}
  return true;
}

(async function start(){
  let wasReset = false;
  try{
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser:true });
    // ⚠️ init 完成後才讀參數，附加資訊這時才從 liff.state 還原
    wasReset = maybeReset();
    pickStage();
    if (liff.isLoggedIn()){
      const p = await liff.getProfile();
      state.userId = p.userId;
      state.displayName = p.displayName;
      state.loggedIn = true;
      setWho("ok", "歡迎，" + p.displayName);
    } else {
      setWho("warn","尚未登入 LINE，集章不會被記錄");
    }
  } catch(err){
    console.error("LIFF 初始化失敗", err);
    wasReset = maybeReset();
    pickStage();
    setWho("warn","訪客模式：未透過 LINE 開啟，可閱讀但不會記錄");
  }
  render();
  hideSplash();
  if (wasReset) $("who-text").textContent += "（已清空本機集章紀錄）";
  setupDebug();
  flushQueue();                                  // 開頁就試著補送上次沒送成功的
  window.addEventListener("online", flushQueue); // 網路恢復再補一次
})();

function pickStage(){
  const s = new URLSearchParams(location.search).get("stage");
  if (s && STAGES[s]){ state.stage = s; state.scanned = true; }
}
function setWho(cls, text){
  $("who").className = "who " + cls;
  $("who-text").textContent = text;
}

/* 本機集章紀錄：只是讓總覽看得出進度，正式統計以後端為準 */
function loadDone(){ try{ return JSON.parse(localStorage.getItem("mb_done_v1")||"[]"); }catch(e){ return []; } }
function markDone(k){ try{ const a=loadDone(); if(!a.includes(k)){ a.push(k); localStorage.setItem("mb_done_v1",JSON.stringify(a)); } }catch(e){} }

/* 記住姓名與族別，第二站之後自動帶入 */
function loadProfile(){ try{ return JSON.parse(localStorage.getItem("mb_profile_v1")||"{}"); }catch(e){ return {}; } }
function saveProfile(realName, tribe){
  try{ localStorage.setItem("mb_profile_v1", JSON.stringify({realName, tribe})); }catch(e){}
}

/* ============================================================
   送資料到後端
   ============================================================ */
async function postCheckin(payload){
  const res = await fetch(API_BASE + "/api/checkin", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "1"   // 少了這行會收到 ngrok 的警告頁而不是 JSON
    },
    body: JSON.stringify(payload)
  });
  if (res.status >= 400 && res.status < 500){
    // 資料本身有問題，重試也不會成功
    let msg = "資料有誤，請確認後再送出";
    try{ const j = await res.json(); if (j && j.detail) msg = j.detail; }catch(e){}
    const err = new Error(msg); err.fatal = true; throw err;
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* 離線補送：送不出去先存手機，之後自動補 */
function loadQueue(){ try{ return JSON.parse(localStorage.getItem(K_QUEUE)||"[]"); }catch(e){ return []; } }
function saveQueue(q){ try{ localStorage.setItem(K_QUEUE, JSON.stringify(q)); }catch(e){} }
function queuePush(p){ const q = loadQueue(); q.push(p); saveQueue(q); }

async function flushQueue(){
  if (!API_BASE) return;
  const q = loadQueue();
  if (!q.length) return;
  const left = [];
  for (const p of q){
    try{ await postCheckin(p); }
    catch(e){ if (!e.fatal) left.push(p); }   // fatal 的直接丟掉，留著也沒用
  }
  saveQueue(left);
  if (q.length !== left.length) console.log(`補送成功 ${q.length - left.length} 筆，剩 ${left.length} 筆`);
}

function render(){ state.stage ? renderStage() : renderMenu(); }

function renderProgress(activeKey){

    ? `第 ${ORDER.indexOf(activeKey)+1} 站，共 ${ORDER.length} 站`
    : `已完成 ${done.length} / ${ORDER.length} 站`;
  $("progress").innerHTML = `<div class="pips">${pips}</div><span class="label">${label}</span>`;
}

        <p class="feedback" id="feedback"></p>

      <section class="reward hidden" id="reward">
        <div class="head">${eyeSVG(46)}<h2>答對了</h2></div>
        <p class="note">留下基本資料，就完成這一站的集章。</p>
        ${prof.realName ? `<p class="prefill">已帶入你上一站填的資料，直接按送出就好。要改也可以。</p>` : ""}
        <label for="userName">真實姓名</label>
        <input type="text" id="userName" autocomplete="name" placeholder="請輸入您的姓名" value="${esc(prof.realName||"")}">
        <label for="userTribe">您的族別</label>
        <select id="userTribe">
          <option value=""${prof.tribe ? "" : " selected"} disabled>請選擇族別</option>

function goMenu(){ state.stage = null; state.scanned = false; render(); }

/* ---------- 族語片語 ---------- */
function phraseHTML(caption, pin){
  const i = (typeof pin === "number") ? pin : Math.floor(Math.random()*PHRASES.length);
  state.phraseIdx = i;
  const [tw, zh, note] = PHRASES[i];
  return `<section class="phrase" id="phrase">
      <p class="cap">${esc(caption)}</p>
      <p class="tw truku" id="ph-tw">${esc(tw)}</p>
      <p class="zh" id="ph-zh">${esc(zh)}</p>
      <p class="ph-note" id="ph-note"${note ? "" : ' style="display:none"'}>${esc(note||"")}</p>
      <div class="ph-controls">
        <button class="ph-play" id="ph-play">▶　播放發音</button>
        <button class="ph-next" id="ph-next">再學一句</button>
      </div>
      <p class="ph-tip">聽不到的話，檢查手機音量和側邊的靜音開關</p>
      <audio id="ph-audio" preload="auto" playsinline src="${AUDIO_DIR}/${i+1}${AUDIO_EXT}"></audio>
    </section>`;
}

function setPhrase(i){
  state.phraseIdx = i;
  const [tw, zh, note] = PHRASES[i];
  $("ph-tw").textContent = tw;
  $("ph-zh").textContent = zh;
  const n = $("ph-note");
  n.textContent = note || "";
  n.style.display = note ? "block" : "none";
  const a = $("ph-audio");
  a.pause();
  a.src = `${AUDIO_DIR}/${i+1}${AUDIO_EXT}`;
  a.load();
  setPlay("▶　播放發音");
}

function setPlay(label){ const b = $("ph-play"); if (b) b.textContent = label; }

function bindPhrase(){
  const next = $("ph-next"), play = $("ph-play"), audio = $("ph-audio");
  if (!next) return;

  next.addEventListener("click", ()=>{
    let i; do { i = Math.floor(Math.random()*PHRASES.length); } while (i === state.phraseIdx && PHRASES.length>1);
    setPhrase(i);
  });

  // 手機瀏覽器一律禁止自動播放，一定要使用者自己點一下
  play.addEventListener("click", async ()=>{
    if (!audio.paused){ audio.pause(); audio.currentTime = 0; setPlay("▶　播放發音"); return; }
    try{
      setPlay("播放中…");
      await audio.play();
    }catch(e){
      console.error(e);
      setPlay("無法播放，請確認音量");
    }
  });

  audio.addEventListener("ended", ()=> setPlay("▶　再聽一次"));
  audio.addEventListener("error", ()=> setPlay("音檔還沒上傳"));
}

/* ---------- 互動 ---------- */
function answer(btn, s){
  if (Number(btn.dataset.i) === s.answer){
    $("quiz").classList.add("hidden");
    $("reward").classList.remove("hidden");
    $("reward").scrollIntoView({behavior:"smooth", block:"start"});
  } else {
    btn.disabled = true;
    btn.classList.add("wrong");
    $("feedback").textContent = "這個不是。" + s.hint;
  }
}

async function submit(){
  const name  = $("userName").value.trim();
  const tribe = $("userTribe").value;
  const err   = $("formErr");
  const btn   = $("send");

  if (!name){  showErr(err,"請填寫姓名"); $("userName").focus(); return; }
  if (!tribe){ showErr(err,"請選擇族別"); $("userTribe").focus(); return; }
  err.classList.add("hidden");

  const payload = {
    stage: state.stage,
    userId: state.userId,
    lineName: state.displayName,
    realName: name,
    tribe: tribe,
    submittedAt: new Date().toISOString()
  };

  btn.disabled = true; btn.textContent = "送出中…";
  try{
    if (API_BASE){ await postCheckin(payload); }
    else { console.log("尚未設定 API_BASE，將送出的資料：", payload); }
    markDone(state.stage);
    saveProfile(name, tribe);
    renderDone(name, false);
  } catch(e){
    console.error(e);
    if (e.fatal){
      // 姓名沒填、沒登入之類，重試沒用，直接告訴使用者
      btn.disabled = false; btn.textContent = "送出資料";
      showErr(err, e.message);
      return;
    }
    // 網路或伺服器的問題：先存起來，之後自動補送，不要卡住現場的人
    queuePush(payload);
    markDone(state.stage);
    saveProfile(name, tribe);
    renderDone(name, true);
  }
}

function renderDone(name, pending){
  const s = STAGES[state.stage];
  const left = ORDER.length - loadDone().length;
  $("reward").classList.add("hidden");
  const el = $("done");
  el.className = "done";
  el.innerHTML = `
    ${eyeSVG(104)}
    <h2>${esc(s.termZh)} 完成</h2>
    <p class="name">${esc(name)}</p>
    <p class="sub">${left>0 ? `還有 ${left} 個導覽點等你` : "六個導覽點全部完成了"}</p>
    ${pending ? `<p class="pending">網路不太穩，資料已暫存在手機，恢復連線後會自動送出。你可以繼續下一站。</p>` : ""}

    <div class="next">
      <h3>接下來：族語聊天室</h3>
      <p>帶著下面這一句，到族語聊天室向老師說一次，就能兌換禮品。</p>
    </div>
    ${phraseHTML("把這一句帶去挑戰", s.pin)}
  `;
  bindPhrase();
  renderProgress(state.stage);
  el.scrollIntoView({behavior:"smooth", block:"center"});
}

function showErr(el,msg){ el.textContent = msg; el.classList.remove("hidden"); }

/* 祖靈之眼 Dowriq Utux */
function eyeSVG(size){
  return `<svg class="eye" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M50 4 L96 50 L50 96 L4 50 Z" fill="none" stroke="#96271F" stroke-width="3.5"/>
    <path d="M50 19 L81 50 L50 81 L19 50 Z" fill="none" stroke="#1A1512" stroke-width="3"/>
    <path d="M50 33 L67 50 L50 67 L33 50 Z" fill="#96271F"/>
    <path d="M50 43 L57 50 L50 57 L43 50 Z" fill="#F2EEE3"/>
  </svg>`;
}

function setupDebug(){
  if (new URLSearchParams(location.search).get("debug") !== "1") return;
  const box = $("debug"); box.style.display = "block";
  let inClient="n/a", os="n/a", ver="n/a";
  try{ inClient = liff.isInClient(); os = liff.getOS(); ver = liff.getVersion(); }catch(e){}
  box.textContent =
    "BUILD: " + BUILD +
    "\nURL: " + location.href +
    "\nstage: " + state.stage + "   scanned: " + state.scanned +
    "\nuserId: " + (state.userId || "-") +
    "\nisInClient: " + inClient + "   isLoggedIn: " + state.loggedIn +
    "\nOS: " + os + " / LIFF " + ver +
    "\ndone: " + JSON.stringify(loadDone());
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
